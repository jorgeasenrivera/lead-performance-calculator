name: native journal validation

on:
  pull_request:
    paths: ['native/**', '.github/workflows/native-journal-validation.yml']

permissions:
  contents: read

concurrency:
  group: native-journal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  darwin:
    name: Darwin synthetic storage
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile and run synthetic storage probes
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          xcodebuild -version
          xcrun swiftc --version
          xcrun swiftc -swift-version 5 native/modules/sage-live/ios/SageIntentJournalStore.swift native/checks/platform-store/SwiftStoreProbe.swift -o "$RUNNER_TEMP/SwiftStoreProbe"
          "$RUNNER_TEMP/SwiftStoreProbe"

  android:
    name: Android compile and synthetic emulator storage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies and generate disposable project
        working-directory: native
        run: |
          git rev-parse HEAD
          npm ci --no-audit --no-fund
          npx --no-install expo prebuild --platform android --clean --no-install
          node checks/platform-store/prepare-android-ci.mjs
      - name: Record generated toolchain and compile
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :journalProbe:reportJournalToolchain --no-daemon --console=plain | tee journal-toolchain.txt
          ./gradlew :app:compileReleaseKotlin :journalProbe:assembleDebug --no-daemon --console=plain
      - name: Run only synthetic storage APK
        shell: bash
        run: |
          python3 -B native/checks/platform-store/test_android_acceleration.py
          python3 -B native/checks/platform-store/test_android_kvm_identity.py
          python3 -B native/checks/platform-store/test_android_stage_lifecycle.py
          bash native/checks/platform-store/run-android-ci.sh
