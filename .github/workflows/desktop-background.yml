name: desktop-background
on:
  push:
    branches: [codex/desktop-background-scope]
  pull_request:
    paths:
      - scripts/desktop-background*.mjs
      - test/desktop-background.test.mjs
      - .github/workflows/desktop-background.yml
permissions:
  contents: read
jobs:
  compare:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: abcc33dc7e9ad97f93f0517b6d0d41104b9fe111
          path: .desktop-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ec1ca5308bc8db162d090bf65e7f4d7f228d2bf4
          path: .desktop-profiler
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7fdf5aeac8499d1a25a10e7b57ae8259dfb759d5
          path: .desktop-signal
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: node --test test/desktop-background.test.mjs
      - name: Confirm repaired recorder regressions
        run: node --test .desktop-profiler/test/desktop-profile.test.mjs
      - name: Build identical actual Signal assets and local hidden maps
        working-directory: .desktop-signal
        run: |
          node ../node_modules/vite/bin/vite.js build
          node ../node_modules/vite/bin/vite.js build --outDir dist-mapped --sourcemap hidden
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:5433
          VITE_SUPABASE_ANON_KEY: mock-anon-key
      - name: Compare background write scope, not a release speed claim
        shell: bash
        env:
          FEEL_BROWSER: chromium
          DESKTOP_SOURCE_SHA: 7fdf5aeac8499d1a25a10e7b57ae8259dfb759d5
        run: |
          test "$(git -C .desktop-baseline rev-parse HEAD)" = abcc33dc7e9ad97f93f0517b6d0d41104b9fe111
          test "$(git -C .desktop-profiler rev-parse HEAD)" = ec1ca5308bc8db162d090bf65e7f4d7f228d2bf4
          test "$(git -C .desktop-signal rev-parse HEAD)" = "$DESKTOP_SOURCE_SHA"
          node .desktop-baseline/scripts/desktop-baseline-server.mjs .desktop-signal/dist 49218 > desktop-background-server.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:49218/ > /dev/null && break; sleep 0.2; done
          DESKTOP_BACKGROUND_VARIANT=root node scripts/desktop-background.mjs
          DESKTOP_BACKGROUND_VARIANT=backdrop node scripts/desktop-background.mjs
          node scripts/desktop-background-report.mjs
      - name: Keep completed or failed comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-background-chromium
          path: |
            desktop-background-evidence/
            desktop-background-server.log
          if-no-files-found: error
