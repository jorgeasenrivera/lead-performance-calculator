      - name: Collect only synthetic measurement evidence
        if: always()
        run: |
          node --input-type=module <<'EVIDENCE'
          import {mkdirSync,readdirSync,lstatSync,copyFileSync,readFileSync,writeFileSync} from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const inventory=[];
          const output=path.join(process.env.GITHUB_WORKSPACE,'manager-spacing-proof');
          const folders=['manager-runtime-qualification','manager-spacing','manager-selector','search-keyboard','color-phone','hero-bars','manager-viewports','room-hero-colors','hero-freshness','hero-freshness-before'];
          function copy(relative) {
            const stat=lstatSync(relative);if(stat.isSymbolicLink())throw Error('Evidence must be a regular file or directory');
            if(stat.isDirectory()){if(['dist','node_modules','.git'].includes(path.basename(relative)))return;for(const item of readdirSync(relative))copy(path.join(relative,item));}
            else if(stat.isFile()&&['.json','.png','.log','.ndjson','.txt'].includes(path.extname(relative))){const target=path.join(output,relative);mkdirSync(path.dirname(target),{recursive:true});copyFileSync(relative,target);const bytes=readFileSync(target);inventory.push({path:relative,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});}
          }
          mkdirSync(output,{recursive:true});for(const folder of folders)if(readdirSync('.').includes(folder))copy(folder);
          if(!inventory.length)throw Error('No measurement evidence collected');
          writeFileSync(path.join(output,'ARTIFACT-INVENTORY.json'),JSON.stringify(inventory,null,2)+'\n');
          EVIDENCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-spacing-${{ matrix.engine }}-${{ matrix.runtime }}
          path: manager-spacing-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostic metadata without changing measurement outcome
        if: always() && matrix.engine == 'webkit'
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
        run: |
          node --input-type=module <<'CORSSUMMARY'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          import path from 'node:path';
          let records=[], collection='missing-or-invalid';
          try {
            const sanitize=createRequire(import.meta.url)(path.join(process.env.RUNNER_TEMP,'manager-cors-observer.cjs')).safe;
            records=readFileSync('manager-runtime-qualification/cors-trace.ndjson','utf8').trim().split('\n').filter(Boolean).map(line=>sanitize(JSON.parse(line)));
            const active=['mock','browser'].every(source=>records.some(row=>row.kind==='observer-start'&&row.source===source));
            collection=!active?'not-activated':records.some(row=>row.incomplete||row.kind==='observer-incomplete')?'partial':records.some(row=>!['observer-start','observer-summary'].includes(row.kind))?'observed-snapshot':'no-observations';
            for(const record of records)console.log('CORS_TRACE '+JSON.stringify(record));
          } catch { collection='missing-or-invalid'; }
          const report={diagnosticOnly:true,collection,records:records.length,activation:{mock:records.some(row=>row.kind==='observer-start'&&row.source==='mock'),browser:records.some(row=>row.kind==='observer-start'&&row.source==='browser')},browserCloseSummary:records.some(row=>row.kind==='observer-summary'&&row.source==='browser'),mockCompleteness:'unknown-background-source',measurementOutcome:['success','failure','cancelled','skipped'].includes(process.env.MEASUREMENT_OUTCOME)?process.env.MEASUREMENT_OUTCOME:'unknown'};
          console.log('CORS_TRACE_REPORT '+JSON.stringify(report));
          try { appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Trace-only WebKit diagnostic. Collection is not a fix or replacement acceptance run. Original measurement outcome is preserved. Mock metadata is an open-ended snapshot.\n'); } catch { console.log('CORS_TRACE_REPORT {"summaryWrite":"unavailable","diagnosticOnly":true}'); }
          CORSSUMMARY
