# Temporary synthetic combined-hero and Week proof. Remove this workflow after observed execution.
name: Combined Calendar WebKit synthetic proof
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  calendar-webkit:
    if: github.repository == 'jorgeasenrivera/lead-performance-calculator' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/scheduler-combined-webkit-proof' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 738a7ec878385b180695fd65b3e17a303edefb11
          path: subject
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: definition
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - name: Verify the event head changes only this test workflow
        shell: bash
        env:
          PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
          PROOF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'GUARD'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.env.GITHUB_WORKSPACE;
          const git=(dir,...args)=>execFileSync('git',args,{cwd:path.join(root,dir),encoding:'utf8'}).trim();
          const file='.github/workflows/scheduler-combined-calendar-proof.yml';
          assert.match(process.env.PROOF_HEAD,/^[0-9a-f]{40}$/);
          assert.match(process.env.PROOF_BASE,/^[0-9a-f]{40}$/);
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')),pr=event.pull_request;
          assert.equal(process.env.GITHUB_EVENT_NAME,'pull_request');assert.equal(event.repository.full_name,'jorgeasenrivera/lead-performance-calculator');assert.equal(pr.head.repo.full_name,event.repository.full_name);assert.equal(pr.base.repo.full_name,event.repository.full_name);assert.equal(pr.head.ref,'codex/scheduler-combined-webkit-proof');assert.equal(pr.base.ref,'main');assert.equal(pr.draft,true);assert.equal(pr.head.sha,process.env.PROOF_HEAD);assert.equal(pr.base.sha,process.env.PROOF_BASE);assert.ok(Number.isSafeInteger(pr.number)&&pr.number>0);
          assert.equal(git('subject','rev-parse','HEAD'),'738a7ec878385b180695fd65b3e17a303edefb11');
          assert.equal(git('subject','rev-parse','HEAD^{tree}'),'93afeef3511cdeb260fc6c805395338e6d0f0699');
          assert.equal(git('definition','rev-parse','HEAD'),process.env.PROOF_HEAD);
          assert.equal(git('definition','status','--porcelain'),'');
          const entries=dir=>execFileSync('git',['ls-tree','-r','--full-tree','-z','HEAD'],{cwd:path.join(root,dir),encoding:'utf8'}).split('\0').filter(Boolean).map(row=>{const i=row.indexOf('\t');return {path:row.slice(i+1),entry:row.slice(0,i)};});
          const subject=entries('subject'),definition=entries('definition');
          assert.equal(subject.some(x=>x.path===file),false);
          assert.deepEqual(definition.filter(x=>x.path!==file),subject,'all non-workflow paths, modes and blobs must equal the frozen subject');
          const only=definition.filter(x=>x.path===file);assert.equal(only.length,1);assert.match(only[0].entry,/^100644 blob [0-9a-f]{40}$/);
          assert.equal(definition.length,subject.length+1);
          fs.mkdirSync(path.join(process.env.GITHUB_WORKSPACE,'calendar-evidence'),{recursive:true});
          fs.writeFileSync(path.join(process.env.GITHUB_WORKSPACE,'calendar-evidence','CI-IDENTITY.json'),JSON.stringify({definition:process.env.PROOF_HEAD,base:process.env.PROOF_BASE,subject:'738a7ec878385b180695fd65b3e17a303edefb11',subjectTree:'93afeef3511cdeb260fc6c805395338e6d0f0699',delta:[file],pr:pr.number,baseRef:pr.base.ref,headRef:pr.head.ref,baseIsRuntimeInput:false},null,2));
          GUARD
      - name: Verify exact subject before dependency setup
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 738a7ec878385b180695fd65b3e17a303edefb11
          test "$(git rev-parse 'HEAD^{tree}')" = 93afeef3511cdeb260fc6c805395338e6d0f0699
          test -z "$(git status --porcelain)"
      - name: Install locked app dependencies and exact isolated driver
        working-directory: subject
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci
          npm install --prefix "$RUNNER_TEMP/calendar-driver" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - name: Run Calendar enabled real dashboard with synthetic loopback inputs
        working-directory: subject
        shell: bash
        env:
          PROBE_SOURCE_ROOT: ${{ github.workspace }}/subject
          PROBE_EVIDENCE_DIR: ${{ github.workspace }}/calendar-evidence
          FEEL_PLAYWRIGHT: ${{ runner.temp }}/calendar-driver/node_modules/playwright/index.mjs
          PROBE_EXPECT_DRIVER: '1.63.0'
          FEEL_BROWSER: webkit
          VITE_SCHEDULER_CALENDAR: '1'
          VITE_SCHEDULER_DRAFT_LOCAL: '0'
          VITE_SCHEDULER_DRAFT_PILOT: '0'
          SCHEDULER_DRAFT_PILOT_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/calendar-proof" "$PROBE_EVIDENCE_DIR"
          cat > "$RUNNER_TEMP/calendar-proof/probe.mjs" <<'NODE'
          // Real app entry and SDK request path against owned synthetic loopback inputs only.
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import http from 'node:http';
          import {spawn,execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import {pathToFileURL} from 'node:url';
          const ROOT=path.resolve(process.env.PROBE_SOURCE_ROOT),E=path.resolve(process.env.PROBE_EVIDENCE_DIR),MOCK='http://127.0.0.1:5433';fs.mkdirSync(E,{recursive:true});
          const EXPECTED='738a7ec878385b180695fd65b3e17a303edefb11',TREE='93afeef3511cdeb260fc6c805395338e6d0f0699';
          const out={scope:'Combined actual dashboard route, synthetic manager Auth/data, normal zoom and normal motion; no hosted identity or storage proof',engine:'webkit',results:[],errors:[],external:[],requests:[]};
          const git=(...args)=>execFileSync('git',args,{cwd:ROOT,encoding:'utf8'}).trim(),sha=b=>createHash('sha256').update(b).digest('hex'),b64=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const USER='00000000-0000-4000-8000-000000000001',session={access_token:`${b64({alg:'none',typ:'JWT'})}.${b64({sub:USER,session_id:'11111111-1111-4111-8111-111111111111',exp:Math.floor(Date.now()/1000)+3600})}.x`,token_type:'bearer',expires_in:3600,expires_at:Math.floor(Date.now()/1000)+3600,refresh_token:'synthetic-refresh',user:{id:USER,email:'demo@sageonline.app',aud:'authenticated',role:'authenticated',app_metadata:{},user_metadata:{},created_at:'2026-01-01T00:00:00Z'}};
          let mock,server,browser,page,phase='preflight';const reachable=async()=>{try{await fetch(MOCK+'/auth/v1/user');return true;}catch{return false;}};
          try{
           assert.equal(git('rev-parse','HEAD'),EXPECTED);assert.equal(git('rev-parse','HEAD^{tree}'),TREE);assert.equal(git('status','--porcelain'),'');out.commit=EXPECTED;out.tree=TREE;
           out.sources=['src/Manager.jsx','src/LeadPerformanceCalculator.jsx','src/scheduler-calendar.jsx','src/scheduler-calendar.css','scripts/scheduler-performance/month-app-core.mjs','scripts/scheduler-performance/planner.css'].map(file=>({path:file,sha256:sha(fs.readFileSync(path.join(ROOT,file)))}));
           assert.equal(await reachable(),false);mock=spawn(process.execPath,['scripts/mock-supabase.mjs'],{cwd:ROOT,stdio:'ignore'});for(let i=0;i<60&&!await reachable();i++)await new Promise(r=>setTimeout(r,100));assert.ok(await reachable());
           process.chdir(ROOT);const flags={VITE_SUPABASE_URL:MOCK,VITE_SUPABASE_ANON_KEY:'synthetic-anon',VITE_SCHEDULER_CALENDAR:'1',VITE_SCHEDULER_DRAFT_LOCAL:'0',VITE_SCHEDULER_DRAFT_PILOT:'0',VITE_SCHEDULER_DRAFT_PILOT_STORE_ID:'',SCHEDULER_DRAFT_PILOT_ENABLED:'0'};Object.assign(process.env,flags);out.flags=flags;
           const{build}=await import(pathToFileURL(path.join(ROOT,'node_modules/vite/dist/node/index.js')));const dist=path.join(E,'dist');await build({root:ROOT,logLevel:'error',build:{outDir:dist,emptyOutDir:true}});
           const built=[];const walk=dir=>{for(const f of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,f.name);if(f.isDirectory())walk(file);else{assert.ok(f.isFile());const b=fs.readFileSync(file);built.push({path:path.relative(dist,file),bytes:b.length,sha256:sha(b)});}}};walk(dist);fs.writeFileSync(path.join(E,'BUILD-MANIFEST.json'),JSON.stringify(built,null,2)+'\n');
           const scripts=built.filter(x=>x.path.endsWith('.js')).map(x=>fs.readFileSync(path.join(dist,x.path),'utf8')).join('\n');assert.ok(scripts.includes(MOCK));assert.ok(!scripts.includes('dydfevdnpppvxgdptiwv'));
           server=http.createServer((req,res)=>{const u=new URL(req.url,'http://local');if(u.pathname.startsWith('/api/'))return res.writeHead(503,{'content-type':'application/json'}).end('{"error":"unavailable"}');let file=path.resolve(dist,'.'+decodeURIComponent(u.pathname));if(!file.startsWith(dist+path.sep)||!fs.existsSync(file)||fs.statSync(file).isDirectory()){if(path.extname(u.pathname))return res.writeHead(404).end();file=path.join(dist,'index.html');}res.writeHead(200,{'content-type':({'.html':'text/html','.js':'text/javascript','.css':'text/css','.woff2':'font/woff2','.svg':'image/svg+xml','.png':'image/png'})[path.extname(file)]||'application/octet-stream'}).end(fs.readFileSync(file));});await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin=`http://127.0.0.1:${server.address().port}`;
           const DRIVER=process.env.FEEL_PLAYWRIGHT;out.driver=JSON.parse(fs.readFileSync(path.join(path.dirname(DRIVER),'package.json'),'utf8')).version;assert.equal(out.driver,'1.63.0');const {webkit}=await import(pathToFileURL(DRIVER));browser=await webkit.launch();out.browser=browser.version();out.node=process.version;
           for(const{width,date}of[{width:320,date:'2026-11-15'},{width:390,date:'2026-11-15'},{width:1100,date:'2026-11-15'},{width:1101,date:'2026-11-15'},{width:1280,date:'2026-11-15'},{width:390,date:'2026-06-15'}]){
            phase=`actual manager ${width} ${date}`;const actions=[];const context=await browser.newContext({viewport:{width,height:width<700?844:900},hasTouch:width<700,serviceWorkers:'block',reducedMotion:'no-preference'});
            await context.route('**/*',async route=>{const request=route.request(),u=new URL(request.url());if(![origin,MOCK].includes(u.origin)){out.external.push(u.origin+u.pathname);return route.abort();}out.requests.push({width,method:request.method(),path:u.pathname});if(u.origin===MOCK&&u.pathname==='/auth/v1/token')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(session)});if(u.origin===MOCK&&u.pathname==='/rest/v1/profiles'&&request.method()==='GET'){const response=await route.fetch(),j=await response.json(),patch=p=>({...p,role:'manager',active:true,pending:false,stores:['sage-demo']});return route.fulfill({response,json:Array.isArray(j)?j.map(patch):patch(j)});}return route.continue();});await context.routeWebSocket(/.*/,s=>s.close());
            page=await context.newPage();page.on('pageerror',e=>out.errors.push(String(e)));page.on('dialog',d=>d.dismiss());await page.clock.setFixedTime(new Date(date+'T16:00:00Z'));await page.goto(origin,{waitUntil:'domcontentloaded'});await page.locator('input[type=email],input[autocomplete=username]').fill('demo@sageonline.app');await page.locator('input[type=password]').fill('synthetic-only');await page.getByRole('button',{name:'Sign in',exact:true}).click();
            const entry=page.locator('.sc-entry:visible'),toggle=entry.locator('.sc-toggle');await toggle.waitFor({timeout:30000});const recap=page.getByRole('button',{name:'Close the round-up',exact:true});await recap.waitFor({state:'visible',timeout:6000}).catch(()=>{});if(await recap.isVisible()){await recap.click();await recap.waitFor({state:'hidden'});}await page.evaluate(()=>document.fonts.ready);await entry.scrollIntoViewIfNeeded();
            const readHero=()=>entry.evaluate(e=>{const r=e.getBoundingClientRect(),h=e.closest('.bp-hero')||e.closest('.s2-tube'),m=h.querySelector('.bp-five,.s2-body');return{parent:e.parentElement.className,width:r.width,parentWidth:h.clientWidth-parseFloat(getComputedStyle(h).paddingLeft)-parseFloat(getComputedStyle(h).paddingRight),afterMetrics:r.top>=m.getBoundingClientRect().bottom,last:h.lastElementChild===e,scale:visualViewport.scale,font:getComputedStyle(document.documentElement).fontSize,documentWidth:document.documentElement.scrollWidth,viewport:innerWidth,rect:{x:r.x,y:r.y,height:r.height},hit:document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.className,unobscured:e.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2))};});out.heroReadiness=await readHero();await page.waitForFunction(()=>{const e=document.querySelector('.sc-entry[data-layout=compact],.sc-entry[data-layout=panel]');if(!e)return false;const r=e.getBoundingClientRect(),hit=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);return r.width>0&&e.contains(hit);});const hero=await readHero();assert.equal(hero.scale,1);assert.equal(hero.font,'16px');assert.ok(hero.afterMetrics&&hero.last&&hero.unobscured);assert.ok(Math.abs(hero.width-hero.parentWidth)<1);assert.ok(hero.documentWidth<=width+1);await page.screenshot({path:path.join(E,`dashboard-${width}-${date}.png`)});
            if(width<700){await toggle.tap();assert.equal(await toggle.getAttribute('aria-expanded'),'true');}const rows=await entry.locator('.sc-hero-week').count();assert.equal(rows,date.startsWith('2026-06')?5:6);const opener=width<700?entry.locator(`[data-calendar-day="${date}"]`):toggle;if(width<700)await opener.tap();else await opener.click();actions.push('opened-from-dashboard');
            const frame=page.frameLocator('iframe[title="Schedule editor"]'),view=()=>frame.locator('[data-view-switch]:visible');await view().waitFor();assert.equal(await view().inputValue(),'month');actions.push('initial-Month-confirmed');await frame.locator('#app').evaluate(()=>document.fonts.ready);assert.match(await page.locator('.sc-dialog-bar').innerText(),/Not saved/);assert.equal(await page.locator('.sc-draft-controls').count(),0);await page.screenshot({path:path.join(E,`initial-month-${width}-${date}.png`)});
            const measure=async(editing=true)=>{
             const nav=await frame.locator('.month-navigation').boundingBox(),control=await frame.locator('#week-schedule .week-heading button:visible,#week-schedule .week-heading select:visible').first().boundingBox(),select=await view().boundingBox(),outer=await page.locator('.sc-dialog-bar').boundingBox();
             const details=await frame.locator('#app').evaluate(app=>{const heading=app.querySelector('.week-heading').getBoundingClientRect();return{outerScrollTop:app.querySelector('.scheduler-scroll').scrollTop,hiddenMonthHeight:app.querySelector('.calendar-pane').getBoundingClientRect().height,headingTop:heading.top,headingBottom:heading.bottom,secondary:[...app.querySelectorAll('.month-review,details.review,details.footer')].filter(e=>e.getClientRects().length).map(e=>e.getBoundingClientRect().top),motion:matchMedia('(prefers-reduced-motion:reduce)').matches?'reduce':'no-preference'};});
             assert.ok(nav&&control&&select&&outer);assert.ok(control.y>=nav.y+nav.height,'first Week control is below sticky green month header');assert.equal(details.hiddenMonthHeight,0);assert.equal(details.secondary.length,editing?3:0);assert.ok(details.secondary.every(y=>y>=details.headingBottom),'secondary details follow Week controls');
             return{stickyMonthHeader:nav,outerDialogHeader:outer,firstWeekControl:control,viewSelector:select,headerToFirstControl:control.y-nav.y-nav.height,headerToViewSelector:select.y-nav.y-nav.height,outerHeaderToFirstControl:control.y-outer.y-outer.height,...details};
            };
            await view().focus();await page.keyboard.press('ArrowUp');assert.equal(await view().inputValue(),'week');assert.equal(await view().evaluate(e=>e===document.activeElement),true);actions.push('selected-Week-by-keyboard');const beforeMake=await measure(false);await frame.locator('#workspace').click();actions.push('clicked-Make-Schedule');
            // No view switch, explicit scroll, focus action or animation wait before this snapshot.
            const direct=await measure();actions.push('measured-immediate-direct-state');await page.screenshot({path:path.join(E,`direct-Make-Schedule-${width}-${date}.png`)});
            await view().selectOption('month');actions.push('selected-Month');const beforeScroll=await frame.locator('.scheduler-scroll').evaluate(e=>{e.scrollTop=e.scrollHeight;return e.scrollTop;});assert.ok(beforeScroll>0,'scrolled-Month precondition must be nonzero');actions.push('scrolled-Month-to-nonzero');await view().selectOption('week');actions.push('selected-Week-after-scroll');const afterScroll=await measure();actions.push('measured-after-scrolled-Month');await page.screenshot({path:path.join(E,`after-scroll-${width}-${date}.png`)});
            await frame.locator('#workspace').click();await view().focus();await page.keyboard.press('ArrowDown');assert.equal(await view().inputValue(),'month');assert.equal(await view().evaluate(e=>e===document.activeElement),true);await page.locator('.sc-close').click();await page.locator('.sc-planner-dialog').waitFor({state:'detached'});assert.equal(await opener.evaluate(e=>e===document.activeElement),true);
            assert.equal(out.requests.some(x=>x.width===width&&['/api/scheduler','/api/scheduler-manual'].includes(x.path)),false);out.results.push({width,date,rows,hero,actions,beforeMakeSchedule:beforeMake,directMakeSchedule:direct,scrolledMonth:{precondition:beforeScroll,...afterScroll},closeFocus:'pass'});console.log(`PASS ${width} ${date}: direct header->first control ${direct.headerToFirstControl}px; after scroll ${afterScroll.headerToFirstControl}px`);await context.close();page=null;
           }
           assert.deepEqual(out.errors,[]);assert.deepEqual(out.external,[]);assert.equal(git('status','--porcelain'),'');out.ok=true;
          }catch(error){out.ok=false;out.phase=phase;out.error=String(error.stack||error);process.exitCode=1;if(page)await page.screenshot({path:path.join(E,'failure.png')}).catch(()=>{});console.error(error);}finally{await browser?.close();if(server)await new Promise(r=>server.close(r));if(mock&&mock.exitCode===null&&mock.signalCode===null){mock.kill();await new Promise(r=>mock.once('exit',r));}out.cleanup={browserClosed:!!browser,serverClosed:!!server,mockStopped:!!mock&&(mock.exitCode!==null||mock.signalCode!==null)};fs.writeFileSync(path.join(E,'result.json'),JSON.stringify(out,null,2)+'\n');}
          NODE
          node "$RUNNER_TEMP/calendar-proof/probe.mjs" 2>&1 | tee "$PROBE_EVIDENCE_DIR/probe.log"
      - name: Run tracked mounted Week and privacy regression
        working-directory: subject
        shell: bash
        env:
          PROBE_EVIDENCE_DIR: ${{ github.workspace }}/calendar-evidence/integration
          FEEL_PLAYWRIGHT: ${{ runner.temp }}/calendar-driver/node_modules/playwright/index.mjs
          FEEL_BROWSER: webkit
          PROBE_SCHEDULER_FLAG: '1'
          VITE_SCHEDULER_DRAFT_LOCAL: '0'
          VITE_SCHEDULER_DRAFT_PILOT: '0'
          SCHEDULER_DRAFT_PILOT_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_EVIDENCE_DIR"
          node scripts/probe-scheduler-integration.mjs 2>&1 | tee "$PROBE_EVIDENCE_DIR/probe.log"
      - name: Require complete synthetic evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'COMPLETE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';
          const E=path.join(process.env.GITHUB_WORKSPACE,'calendar-evidence'),read=f=>JSON.parse(fs.readFileSync(path.join(E,f),'utf8'));
          const identity=read('CI-IDENTITY.json');assert.equal(identity.subject,'738a7ec878385b180695fd65b3e17a303edefb11');assert.equal(identity.subjectTree,'93afeef3511cdeb260fc6c805395338e6d0f0699');
          const result=read('result.json');assert.equal(result.ok,true);assert.equal(result.commit,identity.subject);assert.equal(result.tree,identity.subjectTree);assert.equal(result.engine,'webkit');assert.equal(result.driver,'1.63.0');assert.deepEqual(result.errors,[]);assert.deepEqual(result.external,[]);assert.deepEqual(result.cleanup,{browserClosed:true,serverClosed:true,mockStopped:true});
          for(const key of ['VITE_SCHEDULER_DRAFT_LOCAL','VITE_SCHEDULER_DRAFT_PILOT','SCHEDULER_DRAFT_PILOT_ENABLED'])assert.equal(result.flags[key],'0');assert.equal(result.flags.VITE_SCHEDULER_CALENDAR,'1');
          assert.deepEqual(result.results.map(x=>[x.width,x.date]),[[320,'2026-11-15'],[390,'2026-11-15'],[1100,'2026-11-15'],[1101,'2026-11-15'],[1280,'2026-11-15'],[390,'2026-06-15']]);
          for(const item of result.results){assert.equal(item.hero.scale,1);assert.equal(item.hero.font,'16px');assert.ok(item.hero.afterMetrics&&item.hero.last&&item.hero.unobscured);assert.equal(item.rows,item.date==='2026-06-15'?5:6);assert.equal(item.actions[item.actions.indexOf('clicked-Make-Schedule')+1],'measured-immediate-direct-state');assert.equal(item.directMakeSchedule.outerScrollTop,0);assert.ok(item.scrolledMonth.precondition>0);assert.equal(item.scrolledMonth.outerScrollTop,0);assert.equal(item.closeFocus,'pass');for(const label of ['dashboard','initial-month','direct-Make-Schedule','after-scroll'])assert.ok(fs.statSync(path.join(E,`${label}-${item.width}-${item.date}.png`)).size>0);}
          assert.equal(result.requests.some(x=>['/api/scheduler','/api/scheduler-manual'].includes(x.path)),false);assert.ok(read('BUILD-MANIFEST.json').length>0);
          const integration=read('integration/result.json');assert.equal(integration.enabled,true);assert.equal(integration.results.length,8);assert.deepEqual(integration.errors,[]);assert.deepEqual(integration.blocked,[]);assert.equal(integration.requests.some(x=>['/api/scheduler','/api/scheduler-manual'].includes(x.path)),false);assert.equal(fs.existsSync(path.join(E,'integration/failure.txt')),false);
          fs.writeFileSync(path.join(E,'EVIDENCE-COMPLETE.json'),JSON.stringify({complete:true,subject:identity.subject,subjectTree:identity.subjectTree,geometryCases:result.results.length,trackedChecks:integration.results.length,measurements:result.results.map(x=>({width:x.width,date:x.date,directGap:x.directMakeSchedule.headerToFirstControl,afterScrollGap:x.scrolledMonth.headerToFirstControl}))},null,2));
          COMPLETE
      - name: Check source stayed unchanged
        if: always()
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 738a7ec878385b180695fd65b3e17a303edefb11
          test "$(git rev-parse 'HEAD^{tree}')" = 93afeef3511cdeb260fc6c805395338e6d0f0699
          test -z "$(git status --porcelain)"
      - name: Retain synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-combined-738a7ec-webkit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 5
