name: desktop-profile
on:
  push:
    branches: [codex/desktop-board-profile]
  pull_request:
    paths:
      - scripts/desktop-profile*.mjs
      - test/desktop-profile.test.mjs
      - .github/workflows/desktop-profile.yml
permissions:
  contents: read
jobs:
  profile:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Accepted immutable baseline driver
        uses: actions/checkout@v4
        with:
          ref: abcc33dc7e9ad97f93f0517b6d0d41104b9fe111
          path: .desktop-baseline
          persist-credentials: false
      - name: Actual immutable Signal source
        uses: actions/checkout@v4
        with:
          ref: 7fdf5aeac8499d1a25a10e7b57ae8259dfb759d5
          path: .desktop-signal
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: node --test test/desktop-profile.test.mjs
      - name: Build identical assets and hidden local maps
        working-directory: .desktop-signal
        run: |
          node ../node_modules/vite/bin/vite.js build
          node ../node_modules/vite/bin/vite.js build --outDir dist-mapped --sourcemap hidden
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:5433
          VITE_SUPABASE_ANON_KEY: mock-anon-key
      - name: Profile desktop cost, not an improved speed score
        shell: bash
        env:
          FEEL_BROWSER: chromium
          DESKTOP_SOURCE_SHA: 7fdf5aeac8499d1a25a10e7b57ae8259dfb759d5
        run: |
          test "$(git -C .desktop-baseline rev-parse HEAD)" = abcc33dc7e9ad97f93f0517b6d0d41104b9fe111
          test "$(git -C .desktop-signal rev-parse HEAD)" = "$DESKTOP_SOURCE_SHA"
          node .desktop-baseline/scripts/desktop-baseline-server.mjs .desktop-signal/dist 49218 > desktop-profile-server.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:49218/ > /dev/null && break; sleep 0.2; done
          node scripts/desktop-profile.mjs
          node scripts/desktop-profile-report.mjs
      - name: Keep completed and failed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-profile-chromium
          path: |
            desktop-profile-evidence/
            desktop-baseline-evidence/
            desktop-profile-server.log
          if-no-files-found: error
