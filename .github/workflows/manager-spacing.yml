name: manager-spacing
on:
  push:
    branches: [codex/signal-phone-spacing]
  pull_request:
    paths:
      - src/Manager.jsx
      - src/LeadPerformanceCalculator.jsx
      - api/_standard-rollup.mjs
      - src/manager-signal.css
      - scripts/manager-selector.mjs
      - scripts/manager-spacing.mjs
      - scripts/search-runtime.sha256
      - scripts/search-runtime.v2.sha256
      - scripts/hero-bars.mjs
      - scripts/manager-viewports.mjs
      - scripts/room-hero-colors.mjs
      - scripts/hero-freshness.mjs
      - scripts/color-phone.mjs
      - scripts/search-keyboard.mjs
      - .github/workflows/manager-spacing.yml
jobs:
  spacing:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/checkout@v4
        with:
          ref: 5bf65105003b3e01227c774ea82e08d5d595bb68
          path: .spacing-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2024e009ad40408926907beb8bf0d820bc235031
          path: .header-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4d050292aea1904d1b6dc35a07116dc9137e9f4f
          path: .dock-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c4d5c032158e573314ca9a12a23a211ec24c7a4c
          path: .rail-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 99644a52fce58ce91ace9b9a5299661ba116a775
          path: .composition-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3573082e31d716c866021eec0f6e87f1f7367ce4
          path: .color-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 57c381c4e07c8d815819bb5e2feed00d104ba4f8
          path: .hero-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e6d087c203bb88685159efbc272e04ce868e4c89
          path: .freshness-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # The #469 release on main. Its tree equals the frozen runtime 710cc8d on every file the
          # original manifest lists, and unlike 710cc8d it stays on main's history.
          ref: d9320e253b603260f6a7355d4bc1c77a59fefa5b
          path: .frozen-runtime
          persist-credentials: false
      - name: Record the commit that is actually under test
        # On a pull request actions/checkout builds the synthetic merge of the PR into its base, so what
        # is measured is not github.event.pull_request.head.sha. Label the tree that was checked out and
        # keep the PR head as SEARCH_TEST_SHA, so the evidence says which is which. Against v2 this is an
        # integration validation: a covered file the base changed after the PR branched fails until the
        # PR is rebased and re-versioned.
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          under_test=$(git rev-parse HEAD)
          test "$under_test" = "${{ github.sha }}"
          echo "SEARCH_RUNTIME_SHA=$under_test" >> "$GITHUB_ENV"
          echo "runtime under test: $under_test"
          echo "pull request head:  ${{ github.event.pull_request.head.sha || 'not a pull request' }}"
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - name: Verify the original frozen baseline is intact
        # v1 is never edited and never shortened. It must be byte-identical to the file the #469 release
        # carries (checking the listed hashes alone would let a deleted line pass), and it must still
        # describe that release's tree.
        run: |
          set -eu
          cmp scripts/search-runtime.sha256 .frozen-runtime/scripts/search-runtime.sha256
          cd .frozen-runtime && sha256sum --check scripts/search-runtime.sha256
      - name: Verify the versioned baseline keeps every frozen path and names every change
        # v2 must cover every path v1 covers, add only the files declared here, and re-hash only the
        # files declared here. A new runtime file or a re-blessed hash is a visible edit to this list.
        run: |
          set -eu
          export LC_ALL=C
          awk '{print $2}' scripts/search-runtime.sha256 | sort > /tmp/v1.paths
          awk '{print $2}' scripts/search-runtime.v2.sha256 | sort > /tmp/v2.paths
          test -z "$(uniq -d /tmp/v2.paths)" || { echo 'v2 lists a path twice:'; uniq -d /tmp/v2.paths; exit 1; }
          dropped=$(comm -23 /tmp/v1.paths /tmp/v2.paths)
          test -z "$dropped" || { printf 'v2 dropped frozen paths:\n%s\n' "$dropped"; exit 1; }
          added=$(comm -13 /tmp/v1.paths /tmp/v2.paths)
          test "$added" = 'api/_standard-rollup.mjs' || { printf 'v2 additions are not the declared set. found:\n%s\n' "$added"; exit 1; }
          changed=$(awk 'NR==FNR { h[$2] = $1; next } ($2 in h) && h[$2] != $1 { print $2 }' scripts/search-runtime.sha256 scripts/search-runtime.v2.sha256 | sort)
          want=$(printf '%s\n' src/LeadPerformanceCalculator.jsx src/Manager.jsx)
          test "$changed" = "$want" || { printf 'v2 re-hashes files that are not the declared set. found:\n%s\n' "$changed"; exit 1; }
          echo "v2 adds: $added"
          echo "v2 re-hashes: $changed"
      - name: Verify the candidate runtime against its versioned baseline
        # The original check, against the candidate. A runtime change after v2 is a new version (v3),
        # never an edit to this one.
        run: sha256sum --check scripts/search-runtime.v2.sha256
      - name: Build fictional app
        run: |
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:5433\nVITE_SUPABASE_ANON_KEY=mock-anon-key\n' > .env.local
          npm run build
          ln -s "$PWD/node_modules" .color-baseline/node_modules
          ln -s "$PWD/node_modules" .hero-baseline/node_modules
          ln -s "$PWD/node_modules" .freshness-baseline/node_modules
          (cd .freshness-baseline && VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build)
          (cd .hero-baseline && VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build)
          cd .color-baseline
          VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build
      - name: Measure before and after
        env:
          FEEL_BROWSER: ${{ matrix.engine }}
          SEARCH_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HERO_BASELINE_URL: http://127.0.0.1:5181/
        run: |
          SALESPERSON=1 node scripts/mock-supabase.mjs > mock.log 2>&1 &
          npx vite preview --port 5178 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5178/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .color-baseline/dist --port 5180 --host 127.0.0.1 > color-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5180/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .hero-baseline/dist --port 5181 --host 127.0.0.1 > hero-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5181/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .freshness-baseline/dist --port 5185 --host 127.0.0.1 > freshness-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5185/ > /dev/null && break; sleep 0.2; done
          SEARCH_RUNTIME_SHA=e6d087c203bb88685159efbc272e04ce868e4c89 FEEL_URL=http://127.0.0.1:5185/ FRESH_OUT=hero-freshness-before node scripts/hero-freshness.mjs
          FRESH_ASSERT=1 FRESH_BASELINE_FILE=hero-freshness-before/evidence.json node scripts/hero-freshness.mjs
          node scripts/hero-bars.mjs
          node scripts/manager-viewports.mjs
          node scripts/room-hero-colors.mjs
          node scripts/color-phone.mjs
          node scripts/search-keyboard.mjs
          node scripts/manager-selector.mjs
          node scripts/manager-spacing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-spacing-${{ matrix.engine }}
          path: |
            manager-spacing/
            manager-selector/
            search-keyboard/
            color-phone/
            hero-bars/
            manager-viewports/
            room-hero-colors/
            hero-freshness/
            hero-freshness-before/
          retention-days: 14
