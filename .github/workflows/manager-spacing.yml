name: manager-spacing
on:
  push:
    branches: [codex/signal-phone-spacing]
  pull_request:
    paths:
      - src/Manager.jsx
      - src/manager-signal.css
      - scripts/manager-selector.mjs
      - scripts/manager-spacing.mjs
      - scripts/search-runtime.sha256
      - scripts/hero-bars.mjs
      - scripts/manager-viewports.mjs
      - scripts/room-hero-colors.mjs
      - scripts/hero-freshness.mjs
      - scripts/color-phone.mjs
      - scripts/search-keyboard.mjs
      - .github/workflows/manager-spacing.yml
      - scripts/rpc-fixture-adapter.mjs
      - test/rpc-fixture-adapter.test.mjs
      - test/manual-alias-snapshot.test.mjs
      - test/staff-arrival.test.mjs
jobs:
  spacing:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/checkout@v4
        with:
          ref: 5bf65105003b3e01227c774ea82e08d5d595bb68
          path: .spacing-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2024e009ad40408926907beb8bf0d820bc235031
          path: .header-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4d050292aea1904d1b6dc35a07116dc9137e9f4f
          path: .dock-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c4d5c032158e573314ca9a12a23a211ec24c7a4c
          path: .rail-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 99644a52fce58ce91ace9b9a5299661ba116a775
          path: .composition-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3573082e31d716c866021eec0f6e87f1f7367ce4
          path: .color-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 57c381c4e07c8d815819bb5e2feed00d104ba4f8
          path: .hero-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e6d087c203bb88685159efbc272e04ce868e4c89
          path: .freshness-baseline
          persist-credentials: false
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - name: PR501 routing (case-sensitive; fixed true or false)
        id: route
        # The branch, event and repository names arrive through env, never interpolated into the script. The shell test below compares bytes, so a
        # branch or repository that differs only in letter case is NOT the PR501 case. Every later condition consumes steps.route.outputs.contract.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "codex/nov1-security-recovery-integration" ] && [ -n "$THIS_REPO" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "contract=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify frozen preview runtime
        # The default guard, unchanged: it runs for every event and branch except the single reviewed PR501 contract case below.
        if: ${{ steps.route.outputs.contract != 'true' }}
        run: sha256sum --check scripts/search-runtime.sha256
      - name: PR501 diagnostics, mark the stage, checkout
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: echo "::notice title=PR501_STAGE::Stage starting, checkout."
      - name: PR501 contract, checkout of the exact event head (history kept)
        id: ck_head
        if: ${{ steps.route.outputs.contract == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr501/head
          fetch-depth: 0
          persist-credentials: false
      - name: PR501 contract, checkout of the frozen #469 baseline (history kept)
        id: ck_frozen
        if: ${{ steps.route.outputs.contract == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: d9320e253b603260f6a7355d4bc1c77a59fefa5b
          path: .pr501/frozen-469
          fetch-depth: 0
          persist-credentials: false
      - name: PR501 contract, checkout of the main baseline (history kept)
        id: ck_main
        if: ${{ steps.route.outputs.contract == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: b8478e9f45654a03cc1f2212896a4eb59a491366
          path: .pr501/base-main
          fetch-depth: 0
          persist-credentials: false
      - name: PR501 contract, checkout of the clean 47757af base (history kept)
        id: ck_477
        if: ${{ steps.route.outputs.contract == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: 47757af2487a0844b7083d50a9fbace01b7fad6e
          path: .pr501/base-477
          fetch-depth: 0
          persist-credentials: false
      - name: PR501 diagnostics, mark the stage, hash
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: echo "::notice title=PR501_STAGE::Stage starting, hash."
      - name: PR501 contract, hash-bind the delta declaration, the runner and every other delta file BEFORE anything runs
        id: hash
        if: ${{ steps.route.outputs.contract == 'true' }}
        env:
          EXPECTED_DELTA_SHA256: "212da60c26bc6f2534d178a9ce1f12c8721ff70bcbd8a50ffc7d072ec3c46e4c"
        run: |
          cd .pr501/head
          echo "${EXPECTED_DELTA_SHA256}  scripts/pr501-contract/DELTA.sha256" | sha256sum --check -
          sha256sum --check scripts/pr501-contract/DELTA.sha256
      - name: PR501 diagnostics, mark the stage, install
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: echo "::notice title=PR501_STAGE::Stage starting, install."
      - name: PR501 contract, pinned TypeScript for the AST cross-check (version and file hash are verified by the runner)
        id: ts_install
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-save --ignore-scripts --no-audit --no-fund typescript@6.0.2
      - name: PR501 diagnostics, mark the stage, verify
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: echo "::notice title=PR501_STAGE::Stage starting, verify."
      - name: PR501 contract, verify (this branch only, replaces the original-manifest check against the PR tree, and the original 106 rows are still enforced against the frozen #469 tree inside)
        id: verify
        if: ${{ steps.route.outputs.contract == 'true' }}
        env:
          # External pins, supplied by this workflow, which is the one bootstrap exception: it is covered by independent diff review, and the runner
          # recomputes this file from the old blob plus the reviewed template and refuses any other bytes.
          EXPECTED_CONTRACT_DIGEST: "43d189a49c7dcb23825b037bc5a4ad472aa13a776372201560f73240776725f9"
          EXPECTED_DELTA_SHA256: "212da60c26bc6f2534d178a9ce1f12c8721ff70bcbd8a50ffc7d072ec3c46e4c"
          EXPECTED_VALIDATOR_SHA256: "1a80e14c786754c7a0a83c5785acbf0c17d2c26b3e2e53ec8b556937d0d7f228"
          EXPECTED_TS_VERSION: "6.0.2"
          EXPECTED_TS_LIB_SHA256: "630f808ac32d968a49a392c42cc06fd72abd939aaa7edfe3302810c067934653"
          # The workspace checkout is the ACTUAL checkout (the synthetic merge commit, GITHUB_SHA); .pr501/head is the exact event head.
          CHECKOUT_HEAD: ${{ github.workspace }}/.pr501/head
          CHECKOUT_MERGE: ${{ github.workspace }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FROZEN_469_DIR: ${{ github.workspace }}/.pr501/frozen-469
          BASE_MAIN_DIR: ${{ github.workspace }}/.pr501/base-main
          BASE_477_DIR: ${{ github.workspace }}/.pr501/base-477
          OUT_DIR: ${{ runner.temp }}/pr501-contract-out
        shell: bash
        run: |
          export PR501_TS_PATH="$RUNNER_TEMP/ts/node_modules/typescript"
          # Git refuses a checkout owned by another user ("dubious ownership"), and the workspace checkout is one in this container. The exception below names ONLY that one
          # checkout and exists ONLY in the environment of the one node process: not in the step, the job or any global configuration. Every precondition is checked first
          # and a failed one stops the step with a fixed word (never an echo of any value); an inherited git configuration variable is refused, never overwritten. The step runs
          # under an explicit bash (the guard uses a bash builtin); if the list of variables cannot be read at all, that is itself a refusal.
          refuse() { echo "::error title=PR501_RUNNER::Trust precondition refused. check=$1."; exit 1; }
          vars=$(compgen -e) || refuse guard
          for v in $vars; do case "$v" in GIT_CONFIG*) refuse inherited ;; esac; done
          [ "${GITHUB_REPOSITORY-}" = "jorgeasenrivera/lead-performance-calculator" ] || refuse repo
          [ -n "${GITHUB_WORKSPACE-}" ] && [ "${CHECKOUT_MERGE-}" = "$GITHUB_WORKSPACE" ] || refuse path
          [ -d "$CHECKOUT_MERGE" ] && [ ! -L "$CHECKOUT_MERGE" ] || refuse symlink
          [ "$(cd "$CHECKOUT_MERGE" && pwd -P)" = "$CHECKOUT_MERGE" ] || refuse path
          [ -d "$CHECKOUT_MERGE/.git" ] && [ ! -L "$CHECKOUT_MERGE/.git" ] && [ -f "$CHECKOUT_MERGE/.git/config" ] && [ ! -L "$CHECKOUT_MERGE/.git/config" ] || refuse symlink
          if grep -qi '^[[:space:]]*\[include' "$CHECKOUT_MERGE/.git/config"; then refuse include; fi
          origin=$(git config --no-includes --file "$CHECKOUT_MERGE/.git/config" --get-all remote.origin.url) || refuse origin
          [ "$origin" = "https://github.com/jorgeasenrivera/lead-performance-calculator" ] || refuse origin
          # The runner's own exit status is kept exactly (exit "$rc"); the annotation names only a closed class of it, never output.
          rc=0
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$CHECKOUT_MERGE" node .pr501/head/scripts/pr501-contract/ci-verify.mjs || rc=$?
          case "$rc" in
            0) echo "::notice title=PR501_RUNNER::Runner exit class. exit=0." ;;
            1) echo "::error title=PR501_RUNNER::Runner exit class. exit=1." ;;
            2) echo "::error title=PR501_RUNNER::Runner exit class. exit=2." ;;
            3) echo "::error title=PR501_RUNNER::Runner exit class. exit=3." ;;
            *) echo "::error title=PR501_RUNNER::Runner exit class. exit=other." ;;
          esac
          exit "$rc"
      - name: PR501 contract, keep the result
        if: ${{ always() && steps.route.outputs.contract == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr501-contract-result-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/pr501-contract-out/result.json
            ${{ runner.temp }}/pr501-contract-out/validator-result.json
          retention-days: 14
      - name: PR501 diagnostics, mark the stage, build
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: echo "::notice title=PR501_STAGE::Stage starting, build."
      - name: Build fictional app
        run: |
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:5433\nVITE_SUPABASE_ANON_KEY=mock-anon-key\n' > .env.local
          npm run build
          ln -s "$PWD/node_modules" .color-baseline/node_modules
          ln -s "$PWD/node_modules" .hero-baseline/node_modules
          ln -s "$PWD/node_modules" .freshness-baseline/node_modules
          (cd .freshness-baseline && VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build)
          (cd .hero-baseline && VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build)
          cd .color-baseline
          VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build
      - name: PR501 diagnostics, mark the stage, measurement
        if: ${{ steps.route.outputs.contract == 'true' }}
        run: echo "::notice title=PR501_STAGE::Stage starting, measurement."
      - name: Measure before and after
        env:
          FEEL_BROWSER: ${{ matrix.engine }}
          SEARCH_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEARCH_RUNTIME_SHA: 710cc8d78d0363856df2f9000162923859434b73
          HERO_BASELINE_URL: http://127.0.0.1:5181/
        run: |
          SALESPERSON=1 node scripts/mock-supabase.mjs > mock.log 2>&1 &
          npx vite preview --port 5178 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5178/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .color-baseline/dist --port 5180 --host 127.0.0.1 > color-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5180/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .hero-baseline/dist --port 5181 --host 127.0.0.1 > hero-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5181/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .freshness-baseline/dist --port 5185 --host 127.0.0.1 > freshness-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5185/ > /dev/null && break; sleep 0.2; done
          SEARCH_RUNTIME_SHA=e6d087c203bb88685159efbc272e04ce868e4c89 FEEL_URL=http://127.0.0.1:5185/ FRESH_OUT=hero-freshness-before node scripts/hero-freshness.mjs
          FRESH_ASSERT=1 FRESH_BASELINE_FILE=hero-freshness-before/evidence.json node scripts/hero-freshness.mjs
          node scripts/hero-bars.mjs
          node scripts/manager-viewports.mjs
          node scripts/room-hero-colors.mjs
          node scripts/color-phone.mjs
          node scripts/search-keyboard.mjs
          node scripts/manager-selector.mjs
          node scripts/manager-spacing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-spacing-${{ matrix.engine }}
          path: |
            manager-spacing/
            manager-selector/
            search-keyboard/
            color-phone/
            hero-bars/
            manager-viewports/
            room-hero-colors/
            hero-freshness/
            hero-freshness-before/
          retention-days: 14
      - name: PR501 diagnostics, fixed stage outcomes (fixed text only, no step output is read)
        if: ${{ always() && (steps.route.outputs.contract == 'true' || (steps.route.outcome != 'success' && github.head_ref == 'codex/nov1-security-recovery-integration')) }}
        env:
          O_ROUTE: ${{ steps.route.outcome }}
          O_CK_HEAD: ${{ steps.ck_head.outcome }}
          O_CK_FROZEN: ${{ steps.ck_frozen.outcome }}
          O_CK_MAIN: ${{ steps.ck_main.outcome }}
          O_CK_477: ${{ steps.ck_477.outcome }}
          O_HASH: ${{ steps.hash.outcome }}
          O_TS: ${{ steps.ts_install.outcome }}
          O_VERIFY: ${{ steps.verify.outcome }}
          O_JOB: ${{ job.status }}
        run: |
          # Every value is mapped through a closed list below, so the line can only contain these words. An unexpected value becomes "unknown".
          cls() { case "$1" in success) echo success ;; failure) echo failure ;; cancelled) echo cancelled ;; skipped) echo skipped ;; *) echo unknown ;; esac; }
          line="Stage outcomes. route=$(cls "$O_ROUTE") checkout_head=$(cls "$O_CK_HEAD") checkout_frozen=$(cls "$O_CK_FROZEN") checkout_main=$(cls "$O_CK_MAIN") checkout_477=$(cls "$O_CK_477") hash=$(cls "$O_HASH") install=$(cls "$O_TS") verify=$(cls "$O_VERIFY") job=$(cls "$O_JOB")."
          case "$line" in
            *failure*|*cancelled*) echo "::error title=PR501_OUTCOMES::$line" ;;
            *) echo "::notice title=PR501_OUTCOMES::$line" ;;
          esac
