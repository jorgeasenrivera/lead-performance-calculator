name: manager-spacing
on:
  push:
    branches: [codex/signal-phone-spacing]
  pull_request:
    paths:
      - src/Manager.jsx
      - src/manager-signal.css
      - scripts/manager-selector.mjs
      - scripts/manager-spacing.mjs
      - scripts/search-runtime.sha256
      - scripts/hero-bars.mjs
      - scripts/manager-viewports.mjs
      - scripts/room-hero-colors.mjs
      - scripts/hero-freshness.mjs
      - scripts/color-phone.mjs
      - scripts/search-keyboard.mjs
      - .github/workflows/manager-spacing.yml
      - scripts/scheduler-current-runtime/**
      - test/scheduler-current-runtime.test.mjs
jobs:
  spacing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacing-runtime
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          path: spacing-runtime
          set-safe-directory: false
      - uses: actions/checkout@v4
        with:
          ref: 5bf65105003b3e01227c774ea82e08d5d595bb68
          path: spacing-runtime/.spacing-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2024e009ad40408926907beb8bf0d820bc235031
          path: spacing-runtime/.header-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4d050292aea1904d1b6dc35a07116dc9137e9f4f
          path: spacing-runtime/.dock-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c4d5c032158e573314ca9a12a23a211ec24c7a4c
          path: spacing-runtime/.rail-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 99644a52fce58ce91ace9b9a5299661ba116a775
          path: spacing-runtime/.composition-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3573082e31d716c866021eec0f6e87f1f7367ce4
          path: spacing-runtime/.color-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 57c381c4e07c8d815819bb5e2feed00d104ba4f8
          path: spacing-runtime/.hero-baseline
          set-safe-directory: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e6d087c203bb88685159efbc272e04ce868e4c89
          path: spacing-runtime/.freshness-baseline
          set-safe-directory: false
          persist-credentials: false
      - name: Verify normally owned checkout context
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/scheduler-candidate-current-main'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {lstatSync, mkdirSync, writeFileSync} from 'node:fs';
          import {BASELINES} from './scripts/scheduler-current-runtime/verify.mjs';
          const uid = process.getuid();
          const repositories = ['.', ...Object.keys(BASELINES)].map(path => {
            const directory = lstatSync(path), metadata = lstatSync(path + '/.git');
            assert.ok(directory.isDirectory() && !directory.isSymbolicLink(), 'regular checkout directory: ' + path);
            assert.ok(metadata.isDirectory() && !metadata.isSymbolicLink(), 'regular Git directory: ' + path);
            assert.equal(directory.uid, uid, 'checkout is owned by this process: ' + path);
            assert.equal(metadata.uid, uid, 'Git directory is owned by this process: ' + path);
            return {path, checkoutUid: directory.uid, gitUid: metadata.uid};
          });
          mkdirSync('manager-runtime-qualification', {recursive: true});
          const evidence = {uid, cwd: process.cwd(), home: process.env.HOME, repositories};
          writeFileSync('manager-runtime-qualification/ownership.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE
      - name: Qualify exact scheduler source before installation
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/scheduler-candidate-current-main'
        env:
          VITE_SCHEDULER_CALENDAR: '0'
          VITE_SCHEDULER_DRAFT_LOCAL: '0'
          VITE_SCHEDULER_DRAFT_PILOT: '0'
          SCHEDULER_DRAFT_PILOT_ENABLED: '0'
        run: node scripts/scheduler-current-runtime/verify.mjs before-install
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - name: Verify frozen preview runtime
        id: runtime
        env:
          CURRENT_RUNTIME: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/scheduler-candidate-current-main' }}
          VITE_SCHEDULER_CALENDAR: '0'
          VITE_SCHEDULER_DRAFT_LOCAL: '0'
          VITE_SCHEDULER_DRAFT_PILOT: '0'
          SCHEDULER_DRAFT_PILOT_ENABLED: '0'
        run: |
          if [ "$CURRENT_RUNTIME" = "true" ]; then
            node --test test/scheduler-current-runtime.test.mjs
            node scripts/scheduler-current-runtime/verify.mjs after-install
            printf 'VITE_SUPABASE_URL=http://127.0.0.1:5433\nVITE_SUPABASE_ANON_KEY=mock-anon-key\nVITE_SCHEDULER_CALENDAR=0\nVITE_SCHEDULER_DRAFT_LOCAL=0\nVITE_SCHEDULER_DRAFT_PILOT=0\nSCHEDULER_DRAFT_PILOT_ENABLED=0\n' >> "$GITHUB_ENV"
          else
            sha256sum --check scripts/search-runtime.sha256
            printf 'runtime_sha=710cc8d78d0363856df2f9000162923859434b73\ncase_name=historical-search\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Build fictional app
        run: |
          if [ '${{ steps.runtime.outputs.case_name }}' != 'current-95ad3f93' ]; then
            printf 'VITE_SUPABASE_URL=http://127.0.0.1:5433\nVITE_SUPABASE_ANON_KEY=mock-anon-key\n' > .env.local
          fi
          npm run build
          ln -s "$PWD/node_modules" .color-baseline/node_modules
          ln -s "$PWD/node_modules" .hero-baseline/node_modules
          ln -s "$PWD/node_modules" .freshness-baseline/node_modules
          (cd .freshness-baseline && VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build)
          (cd .hero-baseline && VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build)
          cd .color-baseline
          VITE_SUPABASE_URL=http://127.0.0.1:5433 VITE_SUPABASE_ANON_KEY=mock-anon-key npm run build
      - name: Measure before and after
        env:
          FEEL_BROWSER: ${{ matrix.engine }}
          SEARCH_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEARCH_RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
          HERO_BASELINE_URL: http://127.0.0.1:5181/
        run: |
          SALESPERSON=1 node scripts/mock-supabase.mjs > mock.log 2>&1 &
          npx vite preview --port 5178 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5178/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .color-baseline/dist --port 5180 --host 127.0.0.1 > color-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5180/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .hero-baseline/dist --port 5181 --host 127.0.0.1 > hero-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5181/ > /dev/null && break; sleep 0.2; done
          npx vite preview --outDir .freshness-baseline/dist --port 5185 --host 127.0.0.1 > freshness-baseline.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5185/ > /dev/null && break; sleep 0.2; done
          SEARCH_RUNTIME_SHA=e6d087c203bb88685159efbc272e04ce868e4c89 FEEL_URL=http://127.0.0.1:5185/ FRESH_OUT=hero-freshness-before node scripts/hero-freshness.mjs
          FRESH_ASSERT=1 FRESH_BASELINE_FILE=hero-freshness-before/evidence.json node scripts/hero-freshness.mjs
          node scripts/hero-bars.mjs
          node scripts/manager-viewports.mjs
          node scripts/room-hero-colors.mjs
          node scripts/color-phone.mjs
          node scripts/search-keyboard.mjs
          node scripts/manager-selector.mjs
          node scripts/manager-spacing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-spacing-${{ matrix.engine }}
          path: |
            spacing-runtime/manager-runtime-qualification/
            spacing-runtime/manager-spacing/
            spacing-runtime/manager-selector/
            spacing-runtime/search-keyboard/
            spacing-runtime/color-phone/
            spacing-runtime/hero-bars/
            spacing-runtime/manager-viewports/
            spacing-runtime/room-hero-colors/
            spacing-runtime/hero-freshness/
            spacing-runtime/hero-freshness-before/
          retention-days: 14
