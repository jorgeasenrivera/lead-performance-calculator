name: hero-observed
# Proposal for exact-patch review. Not published.
#
# Separate from webkit-mock-causality.yml and answering a different question: what do the heroes SHOW when a figure is
# missing, a real zero, negative or infinite? scripts/hero-observed.mjs changes the video figures of a few salespeople in
# the fictional store, in both engines, and checks the phone's dials, popups and "Who is below" list and the desk's dial
# cards and weakest standard against numbers worked out from the fixture it builds. It says nothing about the mock or about why WebKit
# once reported page errors. The probe fails on any page error, like the other probes, and keeps its evidence when it does.
#
# Whatever branch it runs on is the tree under test, so it runs against the code that carries the probe. The evidence says
# exactly what that was: the commit, the probe's own hash, the hash of every built file and of what the preview served,
# and the browser's version. With REQUIRE_IDENTITY=1 a run that cannot say those things fails.
on:
  workflow_dispatch:
  push:
    branches: [claude/hero-observed]
permissions:
  contents: read
jobs:
  observed:
    name: observed (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record the commit that is actually under test
        # actions/checkout puts github.sha on disk. On a pull request that is the synthetic merge of the PR into its base,
        # so the evidence says which tree was measured, as manager-spacing.yml does.
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          under_test=$(git rev-parse HEAD)
          test "$under_test" = "${{ github.sha }}"
          echo "TESTED_SHA=$under_test" >> "$GITHUB_ENV"
          echo "tree under test: $under_test"
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - name: Build fictional app
        run: |
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:5433\nVITE_SUPABASE_ANON_KEY=mock-anon-key\n' > .env.local
          npm run build
      - name: Read what the heroes show for missing, zero and invalid figures
        env:
          FEEL_BROWSER: ${{ matrix.engine }}
          DIST_DIR: dist
          REQUIRE_IDENTITY: "1"
        run: |
          SALESPERSON=1 node scripts/mock-supabase.mjs > mock.log 2>&1 &
          npx vite preview --port 5178 --host 127.0.0.1 > preview.log 2>&1 &
          for port in 5433 5178; do
            for i in $(seq 1 100); do curl -sf http://127.0.0.1:$port/ > /dev/null && break; sleep 0.2; done
          done
          node scripts/hero-observed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-observed-${{ matrix.engine }}
          path: |
            hero-observed/
            mock.log
            preview.log
          if-no-files-found: warn
          retention-days: 14
