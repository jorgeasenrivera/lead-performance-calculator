name: security authorization candidate
on:
  push:
    branches: [codex/security-authorization-ci]
  pull_request:
permissions:
  contents: read
env:
  SECURITY_RECEIPT_SHA256: "3f694ebd492f1769ac3771e26b5a24a8a72a4d27da3ab8b2537c18592c76676a"
jobs:
  qualify:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/codex/security-authorization-ci') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/security-authorization-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - name: Verify reviewed candidate before dependencies
        run: node scripts/security-ci/verify.mjs --receipt-sha256="$SECURITY_RECEIPT_SHA256"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Selected offline tests
        run: node scripts/security-ci/run.mjs tests
      - name: Isolated offline build
        run: node scripts/security-ci/run.mjs build
      - name: Verify candidate remained unchanged
        if: always()
        run: node scripts/security-ci/verify.mjs --receipt-sha256="$SECURITY_RECEIPT_SHA256"
  browser-capability:
    if: ${{ github.repository == 'jorgeasenrivera/lead-performance-calculator' && github.event_name == 'push' && github.ref == 'refs/heads/codex/security-authorization-ci' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Verify exact reviewed envelope
        run: node scripts/security-ci/verify.mjs --receipt-sha256="$SECURITY_RECEIPT_SHA256"
      - name: Prepare isolated synthetic tools and official runtime
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/sage-canary"
          mkdir -p "$stage/input" "$stage/node"
          cp scripts/browser-canary/* "$stage/input/"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://nodejs.org/dist/v22.23.4/SHASUMS256.txt -o "$stage/SHASUMS256.txt"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz -o "$stage/node.tar.xz"
          expected=1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
          grep -Fx "$expected  node-v22.23.4-linux-x64.tar.xz" "$stage/SHASUMS256.txt"
          echo "$expected  $stage/node.tar.xz" | sha256sum --check
          tar -xJf "$stage/node.tar.xz" --strip-components=1 -C "$stage/node"
          "$stage/node/bin/node" --version
          "$stage/node/bin/node" "$stage/node/lib/node_modules/npm/bin/npm-cli.js" ci --prefix "$stage/input" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          "$stage/node/bin/node" --test "$stage/input/checks.test.mjs"
      - name: Run offline sandbox capability canary
        shell: bash
        env:
          CANARY_STAGE: ${{ runner.temp }}/sage-canary
          CANARY_INPUT: ${{ runner.temp }}/sage-canary/input
        run: bash scripts/browser-canary/run-container.sh
      - name: Verify source remained unchanged
        if: always()
        run: node scripts/security-ci/verify.mjs --receipt-sha256="$SECURITY_RECEIPT_SHA256"
      - name: Retain synthetic capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-capability-${{ github.sha }}
          path: ${{ runner.temp }}/sage-canary/evidence/
          if-no-files-found: error
          retention-days: 3
