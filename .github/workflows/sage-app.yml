# Builds the Sage phone app and hands it to TestFlight or Google Play, from a
# browser: Actions → Sage app → Run workflow. Nothing is installed on anybody's
# computer. Expo compiles the app; Apple is spoken to with an App Store Connect
# API key so no Apple ID login or two-factor code is ever needed here.
#
# Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN         expo.dev → Account settings → Access tokens
#   ASC_API_KEY_P8     App Store Connect → Users and Access → Integrations → the .p8, whole file
#   ASC_KEY_ID         its Key ID
#   ASC_ISSUER_ID      the Issuer ID shown above the keys list
#   APPLE_TEAM_ID      developer.apple.com → Membership details
#   APPLE_TEAM_TYPE    COMPANY_OR_ORGANIZATION or INDIVIDUAL (how the account was enrolled)
#   ASC_APP_ID         optional: the app's Apple ID number, App Store Connect → Sage → App Information
#   IOS_DIST_P12_BASE64      the Apple Distribution certificate with its private key, as a .p12, base64
#   IOS_DIST_P12_PASSWORD    the password that .p12 was made with
#   IOS_PROFILE_BASE64       the App Store provisioning profile for com.sageonline, base64
#   IOS_QUEUE_PROFILE_BASE64 the App Store provisioning profile for com.sageonline.queue
#                            (the Live Activity extension), base64. Without it the
#                            build carries no lock-screen line, and says so.
#
# Expo will use signing credentials in an unattended build but will not create
# the first ones, so the certificate and profile are made once in the browser
# and kept here. See native/README.md.
#   GOOGLE_SERVICES_JSON     Android only, optional: Firebase's google-services.json,
#                            whole file. Without it the app builds and the line still
#                            shows on the lock screen; only push does not work.
#   GOOGLE_PLAY_SERVICE_JSON Android only: a Play Console service account key, for uploads
#
# No Google Play account yet? Untick Upload and pick android. The build then
# makes an APK rather than a Play bundle, and the run's summary carries a link
# to install it straight onto a phone. Nothing else is needed.
#
# It also runs itself: a merge to main that touches native/ builds iOS and
# uploads it to TestFlight, then says so on the pull request that was merged,
# with the build number. Web changes need no build (the app is a shell around
# the site), so only native/ counts.
name: Sage app

on:
  push:
    branches: [main]
    paths: ['native/**']
  workflow_dispatch:
    inputs:
      platform:
        description: Which phone
        type: choice
        options: [ios, android]
        default: ios
      submit:
        description: Upload to TestFlight / Google Play when the build finishes
        type: boolean
        default: true
      rebuild:
        description: Compile a new build (untick to upload the last finished build only)
        type: boolean
        default: true

concurrency:
  group: sage-app-${{ github.event_name == 'push' && 'ios' || inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.event_name == 'push' && 'ios' || inputs.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: native
    env:
      # A run started by a merge has no inputs: it is iOS, built and uploaded.
      PLATFORM: ${{ github.event_name == 'push' && 'ios' || inputs.platform }}
      SUBMIT: ${{ (github.event_name == 'push' || inputs.submit) && 'true' || 'false' }}
      REBUILD: ${{ (github.event_name == 'push' || inputs.rebuild) && 'true' || 'false' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/native/asc-key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install the app's packages
        run: npm ci --no-audit --no-fund

      - name: Check the site address was set
        run: |
          if grep -q "SET-ME" app.json; then
            echo "::error::native/app.json still says SET-ME for extra.siteUrl. Set it to the deployed site first."
            exit 1
          fi

      - name: Apple key and signing files
        if: env.PLATFORM == 'ios'
        run: |
          printf '%s' "$ASC_API_KEY_P8" > asc-key.p8
          # A secret made with Windows' certutil arrives wrapped in BEGIN/END
          # CERTIFICATE lines with a line break every 64 characters; one made on a
          # Mac arrives bare. Both are the same file underneath, so strip the
          # wrapping and the line breaks before decoding rather than asking
          # anybody to hand-edit a secret.
          unwrap() { grep -v '^-----' | tr -d '\r\n ' | base64 -d; }
          printf '%s' "$IOS_DIST_P12_BASE64" | unwrap > dist.p12
          printf '%s' "$IOS_PROFILE_BASE64" | unwrap > sage.mobileprovision
          # Two targets, two profiles: the app, and the widget extension that
          # draws the Live Activity. credentials.json is keyed by Xcode target.
          if [ -n "$IOS_QUEUE_PROFILE_BASE64" ]; then
            printf '%s' "$IOS_QUEUE_PROFILE_BASE64" | unwrap > queue.mobileprovision
            cat > credentials.json <<EOF
          {
            "ios": {
              "Sage": {
                "provisioningProfilePath": "sage.mobileprovision",
                "distributionCertificate": { "path": "dist.p12", "password": "$IOS_DIST_P12_PASSWORD" }
              },
              "SageQueue": {
                "provisioningProfilePath": "queue.mobileprovision",
                "distributionCertificate": { "path": "dist.p12", "password": "$IOS_DIST_P12_PASSWORD" }
              }
            }
          }
          EOF
            if ! openssl smime -inform der -verify -noverify -in queue.mobileprovision 2>/dev/null | grep -q "com.sageonline.queue"; then
              echo "::error::queue.mobileprovision is not the App Store profile for com.sageonline.queue. Re-paste IOS_QUEUE_PROFILE_BASE64."; exit 1
            fi
          else
            echo "::error::IOS_QUEUE_PROFILE_BASE64 is not set. The Live Activity extension (com.sageonline.queue) needs its own App ID and App Store profile; see native/README.md."
            exit 1
          fi
          for f in asc-key.p8 dist.p12 sage.mobileprovision; do
            if [ ! -s "$f" ]; then echo "::error::$f is empty. The matching secret is missing or blank."; exit 1; fi
          done
          # Open each file here, so a bad paste is named on this page rather
          # than as "unknown error" twenty minutes later on Expo's.
          if ! openssl pkcs12 -in dist.p12 -passin "pass:$IOS_DIST_P12_PASSWORD" -nokeys -clcerts 2>/dev/null | openssl x509 -noout -subject -enddate; then
            echo "::error::dist.p12 does not open with IOS_DIST_P12_PASSWORD. Re-paste IOS_DIST_P12_BASE64 and IOS_DIST_P12_PASSWORD."; exit 1
          fi
          if ! openssl smime -inform der -verify -noverify -in sage.mobileprovision 2>/dev/null | grep -q "com.sageonline"; then
            echo "::error::sage.mobileprovision is not the App Store profile for com.sageonline. Re-paste IOS_PROFILE_BASE64."; exit 1
          fi
          openssl smime -inform der -verify -noverify -in sage.mobileprovision 2>/dev/null | grep -A1 "<key>Name</key>\|ExpirationDate" | grep -v "^--" | sed 's/^[[:space:]]*//'
          if ! grep -q "BEGIN PRIVATE KEY" asc-key.p8; then
            echo "::error::asc-key.p8 does not look like an App Store Connect API key. Re-paste ASC_API_KEY_P8 including the BEGIN and END lines."; exit 1
          fi
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_QUEUE_PROFILE_BASE64: ${{ secrets.IOS_QUEUE_PROFILE_BASE64 }}

      # Firebase is what carries push to an Android phone. It is not what draws
      # the line on the lock screen, which the app posts itself, so a build
      # without this is worth having and says what it is missing.
      - name: Google services file
        if: env.PLATFORM == 'android'
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Firebase config in place."
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret. The app builds and the lock-screen line works; push notifications will not."
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # Ask Apple whether the App Store Connect key is real before spending a
      # build on it: sign a token the way Apple's API wants and list the apps.
      # A 401 here means the key id, the issuer id and the .p8 do not belong
      # together, which no later step can say this plainly.
      - name: Check the App Store Connect key with Apple
        if: env.PLATFORM == 'ios'
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const pem = fs.readFileSync("asc-key.p8", "utf8");
            let key; try { key = crypto.createPrivateKey(pem); } catch (e) {
              console.log("::error::asc-key.p8 is not a readable private key. Re-paste ASC_API_KEY_P8 from the App Store Connect key file."); process.exit(1); }
            const now = Math.floor(Date.now() / 1000);
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const head = b64({ alg: "ES256", kid: process.env.EXPO_ASC_KEY_ID, typ: "JWT" });
            const body = b64({ iss: process.env.EXPO_ASC_ISSUER_ID, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = crypto.sign("sha256", Buffer.from(head + "." + body), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
            fetch("https://api.appstoreconnect.apple.com/v1/apps?limit=5", { headers: { Authorization: "Bearer " + head + "." + body + "." + sig } })
              .then(async (r) => {
                const t = await r.text();
                if (r.status !== 200) {
                  console.log("::error::App Store Connect refused the API key (" + r.status + "). ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID must all come from the same key on App Store Connect → Users and Access → Integrations → Team Keys. The push key from developer.apple.com is a different key and belongs only in Vercel.");
                  console.log(t.slice(0, 500)); process.exit(1);
                }
                const apps = JSON.parse(t).data.map((a) => a.attributes.bundleId);
                console.log("App Store Connect key accepted. Apps this key can see: " + apps.join(", "));
                if (!apps.includes("com.sageonline")) console.log("::warning::com.sageonline is not among them yet; the App Store Connect entry may not exist or the key may lack access.");
              });
          '

      # Ties this folder to a project on the Expo account. Idempotent: the same
      # account and slug resolve to the same project every run.
      - name: Expo project
        run: eas init --force --non-interactive

      # EAS compiles on its own machines and hands back one line: build failed.
      # The reason stays on a web page behind a login, which turned a Kotlin
      # typo into a day of asking somebody to go and copy it out. GitHub's
      # runners already carry the Android SDK, so the same compile runs here
      # first and fails in three minutes with the error in this log.
      - name: Check the Android code compiles
        if: env.PLATFORM == 'android' && env.REBUILD == 'true'
        run: |
          npx expo prebuild -p android --no-install --clean
          cd android
          ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain

      # The production profile makes what a store wants: an .ipa for TestFlight,
      # an .aab for Play. An .aab cannot be installed on a phone by hand, so
      # Android with Upload unticked builds the preview profile instead, which
      # makes an APK, and the link to it goes in the run's summary.
      - name: Build
        id: build
        if: env.REBUILD == 'true'
        run: |
          profile=production
          if [ "$PLATFORM" = "android" ] && [ "$SUBMIT" != "true" ]; then
            profile=preview
            echo "No upload asked for, so this is an APK you can install by hand."
          fi
          # The shell aborts on a failed command, which is how a failed build
          # used to end this step before anything could report why.
          set +e
          eas build --platform "$PLATFORM" --profile "$profile" --non-interactive --wait --json > build.json
          code=$?
          set -e
          node -e '
            try {
              const fs = require("fs");
              const b = JSON.parse(fs.readFileSync("build.json", "utf8"));
              const one = Array.isArray(b) ? b[0] : b;
              if (!one) throw new Error("build.json held no build");
              const a = one.artifacts || {};
              const url = a.buildUrl || a.applicationArchiveUrl;
              // For the note on the pull request: the build number and where it is.
              if (process.env.GITHUB_OUTPUT) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT,
                  "build_version=" + (one.appBuildVersion || "") + "\nbuild_id=" + (one.id || "") + "\nbuild_url=" + (url || "") + "\n");
              }
              if (url) {
                console.log("Build: " + url);
                if (process.env.GITHUB_STEP_SUMMARY) {
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                    "\n### The build\n\n[Download and install it](" + url + ")\n\nOpen that link on the phone itself. Android will ask once for permission to install from the browser.\n");
                }
              }
              const err = one.error || {};
              if (err.message || err.errorCode) {
                console.log("::error::EAS " + (err.errorCode || "failed") + ": " + (err.message || ""));
              }
              if (one.buildLogsUrl || one.logsUrl) console.log("Full log: " + (one.buildLogsUrl || one.logsUrl));
            } catch (e) { console.log("Could not read build.json: " + e.message); }
          ' || true
          # Build metadata only: ids, status, urls and the error. No credentials
          # pass through here, and having it in the log beats going to look.
          if [ "$code" != "0" ]; then
            echo "::group::what EAS returned"
            cat build.json || true
            echo "::endgroup::"
          fi
          exit $code

      # eas submit reads the App Store Connect key from a submit profile in
      # eas.json rather than from flags. Written here for the run and never
      # committed: the ids are secrets. ASC_APP_ID (the app's Apple ID number
      # in App Store Connect → App Information) is optional; without it Expo
      # looks the app up by bundle id.
      - name: Submit profile
        if: env.SUBMIT == 'true' && env.PLATFORM == 'ios'
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            j.submit = j.submit || {}; j.submit.production = j.submit.production || {};
            const ios = { ascApiKeyPath: "./asc-key.p8", ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
                          ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID, appleTeamId: process.env.EXPO_APPLE_TEAM_ID };
            if (process.env.ASC_APP_ID) ios.ascAppId = process.env.ASC_APP_ID;
            j.submit.production.ios = ios;
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2));
          '
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}

      - name: Upload to TestFlight
        id: submit
        if: env.SUBMIT == 'true' && env.PLATFORM == 'ios'
        run: eas submit --platform ios --latest --profile production --non-interactive

      - name: Upload to Google Play
        if: env.SUBMIT == 'true' && env.PLATFORM == 'android'
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_JSON" > play-key.json
          eas submit --platform android --latest --non-interactive --key play-key.json --track internal
        env:
          GOOGLE_PLAY_SERVICE_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_JSON }}

      # The pull request that was merged hears how it went, so nobody has to
      # open the Actions tab to learn the build number or that it failed.
      - name: Tell the pull request
        if: github.event_name == 'push' && always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
          BUILD_VERSION: ${{ steps.build.outputs.build_version }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
            const pr = prs.find((p) => p.merged_at) || prs[0];
            if (!pr) { core.info("no pull request for " + context.sha); return; }
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const v = process.env.BUILD_VERSION, url = process.env.BUILD_URL;
            let body;
            if (process.env.BUILD_OUTCOME !== "success") body = `The app build for this merge failed. [The run](${run}) says why.`;
            else if (process.env.SUBMIT_OUTCOME === "success") body = `App build ${v || ""} is on its way to TestFlight${url ? " ([the build](" + url + "))" : ""}. It shows in TestFlight once Apple has processed it, usually within the hour.`;
            else body = `App build ${v || ""} finished${url ? " ([the build](" + url + "))" : ""}, but the upload to TestFlight failed. [The run](${run}) says why.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });

      - name: Forget the keys
        if: always()
        run: rm -f asc-key.p8 play-key.json google-services.json dist.p12 sage.mobileprovision queue.mobileprovision credentials.json build.json && git checkout -- eas.json app.json 2>/dev/null || true
