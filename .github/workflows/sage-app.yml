# Builds the Sage phone app and hands it to TestFlight or Google Play, from a
# browser: Actions → Sage app → Run workflow. Nothing is installed on anybody's
# computer. Expo compiles the app; Apple is spoken to with an App Store Connect
# API key so no Apple ID login or two-factor code is ever needed here.
#
# Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN         expo.dev → Account settings → Access tokens
#   ASC_API_KEY_P8     App Store Connect → Users and Access → Integrations → the .p8, whole file
#   ASC_KEY_ID         its Key ID
#   ASC_ISSUER_ID      the Issuer ID shown above the keys list
#   APPLE_TEAM_ID      developer.apple.com → Membership details
#   APPLE_TEAM_TYPE    COMPANY_OR_ORGANIZATION or INDIVIDUAL (how the account was enrolled)
#   ASC_APP_ID         optional: the app's Apple ID number, App Store Connect → Sage → App Information
#   IOS_DIST_P12_BASE64      the Apple Distribution certificate with its private key, as a .p12, base64
#   IOS_DIST_P12_PASSWORD    the password that .p12 was made with
#   IOS_PROFILE_BASE64       the App Store provisioning profile for com.sageonline, base64
#
# Expo will use signing credentials in an unattended build but will not create
# the first ones, so the certificate and profile are made once in the browser
# and kept here. See native/README.md.
#   GOOGLE_SERVICES_JSON     Android only: Firebase's google-services.json, whole file
#   GOOGLE_PLAY_SERVICE_JSON Android only: a Play Console service account key, for uploads
name: Sage app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phone
        type: choice
        options: [ios, android]
        default: ios
      submit:
        description: Upload to TestFlight / Google Play when the build finishes
        type: boolean
        default: true
      rebuild:
        description: Compile a new build (untick to upload the last finished build only)
        type: boolean
        default: true

concurrency:
  group: sage-app-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/native/asc-key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install the app's packages
        run: npm ci --no-audit --no-fund

      - name: Check the site address was set
        run: |
          if grep -q "SET-ME" app.json; then
            echo "::error::native/app.json still says SET-ME for extra.siteUrl. Set it to the deployed site first."
            exit 1
          fi

      - name: Apple key and signing files
        if: inputs.platform == 'ios'
        run: |
          printf '%s' "$ASC_API_KEY_P8" > asc-key.p8
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 -d > dist.p12
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d > sage.mobileprovision
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "sage.mobileprovision",
              "distributionCertificate": { "path": "dist.p12", "password": "$IOS_DIST_P12_PASSWORD" }
            }
          }
          EOF
          for f in asc-key.p8 dist.p12 sage.mobileprovision; do
            if [ ! -s "$f" ]; then echo "::error::$f is empty. The matching secret is missing or blank."; exit 1; fi
          done
          # Open each file here, so a bad paste is named on this page rather
          # than as "unknown error" twenty minutes later on Expo's.
          if ! openssl pkcs12 -in dist.p12 -passin "pass:$IOS_DIST_P12_PASSWORD" -nokeys -clcerts 2>/dev/null | openssl x509 -noout -subject -enddate; then
            echo "::error::dist.p12 does not open with IOS_DIST_P12_PASSWORD. Re-paste IOS_DIST_P12_BASE64 and IOS_DIST_P12_PASSWORD."; exit 1
          fi
          if ! openssl smime -inform der -verify -noverify -in sage.mobileprovision 2>/dev/null | grep -q "com.sageonline"; then
            echo "::error::sage.mobileprovision is not the App Store profile for com.sageonline. Re-paste IOS_PROFILE_BASE64."; exit 1
          fi
          openssl smime -inform der -verify -noverify -in sage.mobileprovision 2>/dev/null | grep -A1 "<key>Name</key>\|ExpirationDate" | grep -v "^--" | sed 's/^[[:space:]]*//'
          if ! grep -q "BEGIN PRIVATE KEY" asc-key.p8; then
            echo "::error::asc-key.p8 does not look like an App Store Connect API key. Re-paste ASC_API_KEY_P8 including the BEGIN and END lines."; exit 1
          fi
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}

      - name: Google services file
        if: inputs.platform == 'android'
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # Ask Apple whether the App Store Connect key is real before spending a
      # build on it: sign a token the way Apple's API wants and list the apps.
      # A 401 here means the key id, the issuer id and the .p8 do not belong
      # together, which no later step can say this plainly.
      - name: Check the App Store Connect key with Apple
        if: inputs.platform == 'ios'
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const pem = fs.readFileSync("asc-key.p8", "utf8");
            let key; try { key = crypto.createPrivateKey(pem); } catch (e) {
              console.log("::error::asc-key.p8 is not a readable private key. Re-paste ASC_API_KEY_P8 from the App Store Connect key file."); process.exit(1); }
            const now = Math.floor(Date.now() / 1000);
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const head = b64({ alg: "ES256", kid: process.env.EXPO_ASC_KEY_ID, typ: "JWT" });
            const body = b64({ iss: process.env.EXPO_ASC_ISSUER_ID, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = crypto.sign("sha256", Buffer.from(head + "." + body), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
            fetch("https://api.appstoreconnect.apple.com/v1/apps?limit=5", { headers: { Authorization: "Bearer " + head + "." + body + "." + sig } })
              .then(async (r) => {
                const t = await r.text();
                if (r.status !== 200) {
                  console.log("::error::App Store Connect refused the API key (" + r.status + "). ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID must all come from the same key on App Store Connect → Users and Access → Integrations → Team Keys. The push key from developer.apple.com is a different key and belongs only in Vercel.");
                  console.log(t.slice(0, 500)); process.exit(1);
                }
                const apps = JSON.parse(t).data.map((a) => a.attributes.bundleId);
                console.log("App Store Connect key accepted. Apps this key can see: " + apps.join(", "));
                if (!apps.includes("com.sageonline")) console.log("::warning::com.sageonline is not among them yet; the App Store Connect entry may not exist or the key may lack access.");
              });
          '

      # Ties this folder to a project on the Expo account. Idempotent: the same
      # account and slug resolve to the same project every run.
      - name: Expo project
        run: eas init --force --non-interactive

      - name: Build
        if: inputs.rebuild
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive --wait

      # eas submit reads the App Store Connect key from a submit profile in
      # eas.json rather than from flags. Written here for the run and never
      # committed: the ids are secrets. ASC_APP_ID (the app's Apple ID number
      # in App Store Connect → App Information) is optional; without it Expo
      # looks the app up by bundle id.
      - name: Submit profile
        if: inputs.submit && inputs.platform == 'ios'
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            j.submit = j.submit || {}; j.submit.production = j.submit.production || {};
            const ios = { ascApiKeyPath: "./asc-key.p8", ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
                          ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID, appleTeamId: process.env.EXPO_APPLE_TEAM_ID };
            if (process.env.ASC_APP_ID) ios.ascAppId = process.env.ASC_APP_ID;
            j.submit.production.ios = ios;
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2));
          '
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}

      - name: Upload to TestFlight
        if: inputs.submit && inputs.platform == 'ios'
        run: eas submit --platform ios --latest --profile production --non-interactive

      - name: Upload to Google Play
        if: inputs.submit && inputs.platform == 'android'
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_JSON" > play-key.json
          eas submit --platform android --latest --non-interactive --key play-key.json --track internal
        env:
          GOOGLE_PLAY_SERVICE_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_JSON }}

      - name: Forget the keys
        if: always()
        run: rm -f asc-key.p8 play-key.json google-services.json dist.p12 sage.mobileprovision credentials.json && git checkout -- eas.json app.json 2>/dev/null || true
