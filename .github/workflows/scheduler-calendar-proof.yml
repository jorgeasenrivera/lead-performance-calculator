# Unpublished proposal only. Runtime under test remains the exact PR519 head.
name: Calendar enabled synthetic proof
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  calendar-webkit:
    if: github.repository == 'jorgeasenrivera/lead-performance-calculator' && github.event_name == 'pull_request' && github.event.pull_request.number == 519 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/scheduler-month-first' && github.event.pull_request.base.sha == 'fdf6166a1cdbc9a590b3be729ea8141ef8663f84'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecc66e610b9382eddb15275d019b81e0a4366fc6
          path: subject
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: definition
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - name: Verify the event head changes only this test workflow
        shell: bash
        env:
          PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
          PROOF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'GUARD'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.env.GITHUB_WORKSPACE;
          const git=(dir,...args)=>execFileSync('git',args,{cwd:path.join(root,dir),encoding:'utf8'}).trim();
          const file='.github/workflows/scheduler-calendar-proof.yml';
          assert.match(process.env.PROOF_HEAD,/^[0-9a-f]{40}$/);
          assert.equal(process.env.PROOF_BASE,'fdf6166a1cdbc9a590b3be729ea8141ef8663f84');
          assert.equal(git('subject','rev-parse','HEAD'),'ecc66e610b9382eddb15275d019b81e0a4366fc6');
          assert.equal(git('subject','rev-parse','HEAD^{tree}'),'e6241ff9677c5208e1b2deb66e843477154d6b11');
          assert.equal(git('definition','rev-parse','HEAD'),process.env.PROOF_HEAD);
          assert.equal(git('definition','status','--porcelain'),'');
          const entries=dir=>execFileSync('git',['ls-tree','-r','--full-tree','-z','HEAD'],{cwd:path.join(root,dir),encoding:'utf8'}).split('\0').filter(Boolean).map(row=>{const i=row.indexOf('\t');return {path:row.slice(i+1),entry:row.slice(0,i)};});
          const subject=entries('subject'),definition=entries('definition');
          assert.equal(subject.some(x=>x.path===file),false);
          assert.deepEqual(definition.filter(x=>x.path!==file),subject,'all non-workflow paths, modes and blobs must equal the frozen subject');
          const only=definition.filter(x=>x.path===file);assert.equal(only.length,1);assert.match(only[0].entry,/^100644 blob [0-9a-f]{40}$/);
          assert.equal(definition.length,subject.length+1);
          fs.mkdirSync(path.join(process.env.RUNNER_TEMP,'calendar-evidence'),{recursive:true});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'calendar-evidence','CI-IDENTITY.json'),JSON.stringify({definition:process.env.PROOF_HEAD,base:process.env.PROOF_BASE,subject:'ecc66e610b9382eddb15275d019b81e0a4366fc6',subjectTree:'e6241ff9677c5208e1b2deb66e843477154d6b11',delta:[file]},null,2));
          GUARD
      - name: Verify exact subject before dependency setup
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ecc66e610b9382eddb15275d019b81e0a4366fc6
          test "$(git rev-parse 'HEAD^{tree}')" = e6241ff9677c5208e1b2deb66e843477154d6b11
          test -z "$(git status --porcelain)"
      - name: Install locked app dependencies and exact isolated driver
        working-directory: subject
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci
          npm install --prefix "$RUNNER_TEMP/calendar-driver" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - name: Run Calendar enabled real dashboard with synthetic loopback inputs
        working-directory: subject
        shell: bash
        env:
          PROBE_SOURCE_ROOT: ${{ github.workspace }}/subject
          PROBE_EVIDENCE_DIR: ${{ runner.temp }}/calendar-evidence
          FEEL_PLAYWRIGHT: ${{ runner.temp }}/calendar-driver/node_modules/playwright/index.mjs
          PROBE_EXPECT_DRIVER: '1.63.0'
          FEEL_BROWSER: webkit
          VITE_SCHEDULER_CALENDAR: '1'
          VITE_SCHEDULER_DRAFT_LOCAL: '0'
          VITE_SCHEDULER_DRAFT_PILOT: '0'
          SCHEDULER_DRAFT_PILOT_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/calendar-proof" "$PROBE_EVIDENCE_DIR"
          cat > "$RUNNER_TEMP/calendar-proof/probe.mjs" <<'NODE'
          // Calendar-enabled actual dashboard proof with synthetic loopback Auth/data only.
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import http from 'node:http';
          import {execFileSync,spawn} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          
          const ROOT=path.resolve(process.env.PROBE_SOURCE_ROOT||process.cwd());
          const EVIDENCE=path.resolve(process.env.PROBE_EVIDENCE_DIR||path.join(import.meta.dirname,'evidence'));
          const EXPECTED='ecc66e610b9382eddb15275d019b81e0a4366fc6',TREE='e6241ff9677c5208e1b2deb66e843477154d6b11';
          const MOCK='http://127.0.0.1:5433',USER='00000000-0000-4000-8000-000000000001';
          const DRIVER=process.env.FEEL_PLAYWRIGHT||path.join(ROOT,'node_modules/playwright/index.mjs');
          const ENGINE=process.env.FEEL_BROWSER||'chromium';
          assert.ok(['chromium','webkit'].includes(ENGINE));fs.mkdirSync(EVIDENCE,{recursive:true});
          const out={scope:'Calendar-enabled actual manager dashboard; synthetic Auth and in-memory localhost data only',engine:ENGINE,results:[],errors:[],externalRequests:[],requests:[],warmCachedSession:'not tested',physicalPhone:'not tested',hostedAuth:'not tested'};
          const git=(...args)=>execFileSync('git',args,{cwd:ROOT,encoding:'utf8'}).trim();
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const session={access_token:`${b64({alg:'none',typ:'JWT'})}.${b64({sub:USER,session_id:'11111111-1111-4111-8111-111111111111',exp:Math.floor(Date.now()/1000)+3600})}.x`,token_type:'bearer',expires_in:3600,expires_at:Math.floor(Date.now()/1000)+3600,refresh_token:'synthetic-refresh',user:{id:USER,email:'demo@sageonline.app',aud:'authenticated',role:'authenticated',app_metadata:{},user_metadata:{},created_at:'2026-01-01T00:00:00Z'}};
          let mock,server,browser,page,phase='preflight';
          const reachable=async()=>{try{await fetch(MOCK+'/auth/v1/user');return true;}catch{return false;}};
          try{
            assert.equal(git('rev-parse','HEAD'),EXPECTED);assert.equal(git('rev-parse','HEAD^{tree}'),TREE);assert.equal(git('status','--porcelain'),'');out.commit=EXPECTED;out.tree=TREE;process.chdir(ROOT);
            out.sources=['package.json','package-lock.json','src/Manager.jsx','src/LeadPerformanceCalculator.jsx','src/scheduler-calendar.jsx','src/scheduler-calendar.css','src/scheduler-editor-adapter.mjs','scripts/scheduler-performance/month-app-core.mjs','scripts/mock-supabase.mjs'].map(file=>({file,sha256:sha(fs.readFileSync(path.join(ROOT,file)))}));
            out.node=process.version;out.driver=JSON.parse(fs.readFileSync(path.join(path.dirname(DRIVER),'package.json'))).version;
            if(process.env.PROBE_EXPECT_DRIVER)assert.equal(out.driver,process.env.PROBE_EXPECT_DRIVER);
            assert.equal(await reachable(),false,'owned synthetic mock port must be free');
            mock=spawn(process.execPath,['scripts/mock-supabase.mjs'],{cwd:ROOT,stdio:'ignore',env:{...process.env,SALESPERSON:'0'}});
            for(let i=0;i<60&&!await reachable();i++)await new Promise(r=>setTimeout(r,100));assert.ok(await reachable(),'owned synthetic mock started');
            const flags={VITE_SUPABASE_URL:MOCK,VITE_SUPABASE_ANON_KEY:'synthetic-anon',VITE_SCHEDULER_CALENDAR:'1',VITE_SCHEDULER_DRAFT_LOCAL:'0',VITE_SCHEDULER_DRAFT_PILOT:'0',VITE_SCHEDULER_DRAFT_PILOT_STORE_ID:'',SCHEDULER_DRAFT_PILOT_ENABLED:'0'};
            Object.assign(process.env,flags);out.flags=flags;
            phase='synthetic build';const {build}=await import(pathToFileURL(path.join(ROOT,'node_modules/vite/dist/node/index.js')));
            const dist=path.join(EVIDENCE,'dist');await build({root:ROOT,logLevel:'error',build:{outDir:dist,emptyOutDir:true}});
            const manifest=[];const walk=dir=>{for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const f=path.join(dir,entry.name);if(entry.isDirectory())walk(f);else if(entry.isFile()){const b=fs.readFileSync(f);manifest.push({file:path.relative(dist,f),bytes:b.length,sha256:sha(b)});}else throw Error('non-regular build member');}};walk(dist);manifest.sort((a,b)=>a.file.localeCompare(b.file));
            fs.writeFileSync(path.join(EVIDENCE,'BUILD-MANIFEST.json'),JSON.stringify(manifest,null,2)+'\n');out.buildManifestSha256=sha(fs.readFileSync(path.join(EVIDENCE,'BUILD-MANIFEST.json')));
            const bundles=manifest.filter(f=>f.file.endsWith('.js')).map(f=>fs.readFileSync(path.join(dist,f.file),'utf8')).join('\n');assert.ok(bundles.includes(MOCK));assert.ok(!bundles.includes('dydfevdnpppvxgdptiwv'));assert.ok(bundles.includes('sc-toggle'));out.calendarChunkPresent=true;
            server=http.createServer((req,res)=>{const u=new URL(req.url,'http://local');if(u.pathname.startsWith('/api/')){res.writeHead(503,{'content-type':'application/json'}).end('{"error":"unavailable"}');return;}let f=path.resolve(dist,'.'+decodeURIComponent(u.pathname));if(!f.startsWith(dist+path.sep)||!fs.existsSync(f)||fs.statSync(f).isDirectory()){if(path.extname(u.pathname)){res.writeHead(404).end();return;}f=path.join(dist,'index.html');}res.writeHead(200,{'content-type':({'.html':'text/html','.js':'text/javascript','.css':'text/css','.woff2':'font/woff2','.svg':'image/svg+xml','.png':'image/png'})[path.extname(f)]||'application/octet-stream'}).end(fs.readFileSync(f));});
            await new Promise(r=>server.listen(0,'127.0.0.1',r));const base=`http://127.0.0.1:${server.address().port}`;
            const pw=await import(pathToFileURL(DRIVER));browser=await pw[ENGINE].launch(ENGINE==='chromium'?{executablePath:process.env.FEEL_CHROME||'/usr/bin/chromium'}:{});out.browserVersion=browser.version();
            for(const width of [320,390,1280]){
              phase='cold manager entry '+width;
              const context=await browser.newContext({viewport:{width,height:width<700?844:900},hasTouch:width<700,serviceWorkers:'block',reducedMotion:'reduce'});
              let profileReads=0;
              await context.route('**/*',async route=>{const request=route.request(),u=new URL(request.url());if(u.origin!==base&&u.origin!==MOCK){out.externalRequests.push(u.origin+u.pathname);return route.abort('blockedbyclient');}out.requests.push({width,method:request.method(),path:u.pathname});
                if(u.origin===MOCK&&u.pathname==='/auth/v1/token')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(session)});
                if(u.origin===MOCK&&u.pathname==='/rest/v1/profiles'&&request.method()==='GET'){profileReads++;const response=await route.fetch(),body=await response.json(),asManager=p=>({...p,role:'manager',active:true,pending:false,stores:['sage-demo']});return route.fulfill({response,json:Array.isArray(body)?body.map(asManager):asManager(body)});}
                return route.continue();});
              await context.routeWebSocket(/.*/,socket=>socket.close());
              page=await context.newPage();page.on('pageerror',e=>out.errors.push({width,error:String(e)}));page.on('dialog',d=>d.dismiss());
              await page.goto(base,{waitUntil:'domcontentloaded'});assert.equal(await page.evaluate(()=>localStorage.getItem('lpc-auth')),null,'fresh isolated browser starts with no cached session');
              await page.locator('input[type=email],input[autocomplete=username]').fill('demo@sageonline.app');await page.locator('input[type=password]').fill('synthetic-only');await page.getByRole('button',{name:'Sign in',exact:true}).click();
              const round=page.getByRole('button',{name:'Close the round-up',exact:true});await round.waitFor({state:'visible',timeout:6000}).catch(()=>{});if(await round.isVisible())await round.click();
              const toggle=page.locator('.sc-toggle:visible:enabled').first();await toggle.waitFor({timeout:30000});assert.ok(profileReads>0);await page.evaluate(()=>document.fonts.ready);await toggle.scrollIntoViewIfNeeded();await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
              const card=await toggle.evaluate(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{inDashboard:!!el.closest('.bp-page'),width:r.width,height:r.height,y:r.y,bottom:r.bottom,viewportHeight:innerHeight,centerUnobscured:el.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)),background:s.backgroundColor,color:s.color,padding:s.padding,documentWidth:document.documentElement.scrollWidth,viewport:innerWidth};});
              if(width<700)assert.equal(card.inDashboard,true);assert.ok(card.documentWidth<=width+1);assert.ok(card.y>=0&&card.bottom<=card.viewportHeight,'Calendar card is in viewport before first activation');assert.equal(card.centerUnobscured,true);assert.equal(card.background,'rgb(24, 60, 47)');assert.equal(card.padding,'10px 12px');await page.screenshot({path:path.join(EVIDENCE,'dashboard-'+width+'.png')});
              phase='Calendar Month/Week keyboard '+width;
              if(width<700)await toggle.tap();else{await toggle.focus();await page.keyboard.press('Enter');}
              const dialog=page.locator('.sc-planner-dialog');await dialog.waitFor();const frame=page.frameLocator('iframe[title="Schedule editor"]'),view=()=>frame.locator('[data-view-switch]:visible');await view().waitFor();
              assert.equal(await page.locator('.sc-close').evaluate(el=>el===document.activeElement),true);assert.equal(await view().inputValue(),'month');assert.equal(await frame.locator('.calendar-pane').isVisible(),true);assert.equal(await frame.locator('#week-schedule').isVisible(),false);assert.match(await page.locator('.sc-dialog-bar').innerText(),/Not saved/);await page.screenshot({path:path.join(EVIDENCE,'initial-month-'+width+'.png')});
              await view().focus();await page.keyboard.press('ArrowUp');assert.equal(await view().inputValue(),'week');assert.equal(await frame.locator('#week-schedule').isVisible(),true);assert.equal(await view().evaluate(el=>el===document.activeElement),true);await page.screenshot({path:path.join(EVIDENCE,'week-'+width+'.png')});
              await page.keyboard.press('ArrowDown');assert.equal(await view().inputValue(),'month');assert.equal(await frame.locator('.calendar-pane').isVisible(),true);assert.equal(await view().evaluate(el=>el===document.activeElement),true);
              await page.keyboard.press('Escape');await dialog.waitFor({state:'detached'});assert.equal(await toggle.evaluate(el=>el===document.activeElement),true,'Escape returns focus to original dashboard entry');assert.equal(await page.locator('#root').getAttribute('inert'),null);
              await page.keyboard.press('Enter');await view().waitFor();assert.equal(await view().inputValue(),'month','fresh reopened editor starts in Month');await page.locator('.sc-close').click();await dialog.waitFor({state:'detached'});assert.equal(await toggle.evaluate(el=>el===document.activeElement),true,'Close returns focus to original dashboard entry');
              assert.equal(out.requests.some(r=>r.width===width&&['/api/scheduler','/api/scheduler-manual'].includes(r.path)),false);out.results.push({width,coldSyntheticSession:true,syntheticRole:'manager',profileReads,card,initialMonth:'pass',keyboardWeekMonth:'pass',escapeCloseFocus:'pass',buttonCloseFocus:'pass',schedulerPersistenceRequests:0});console.log('PASS cold manager dashboard/Month/keyboard/close '+width);await context.close();page=null;
            }
            assert.deepEqual(out.errors,[]);assert.deepEqual(out.externalRequests,[]);out.ok=true;
          }catch(error){out.ok=false;out.phase=phase;out.failure=String(error.stack||error);process.exitCode=1;if(page){await page.screenshot({path:path.join(EVIDENCE,'failure.png')}).catch(()=>{});fs.writeFileSync(path.join(EVIDENCE,'failure-body.txt'),await page.locator('body').innerText().catch(()=>''));}console.error(error);}
          finally{if(browser)await browser.close();if(server)await new Promise(r=>server.close(r));if(mock&&mock.exitCode===null&&mock.signalCode===null){mock.kill();await new Promise(r=>mock.once('exit',r));}out.cleanup={browserClosed:!!browser,serverClosed:!!server,mockStopped:!!mock&&(mock.exitCode!==null||mock.signalCode!==null)};fs.writeFileSync(path.join(EVIDENCE,'result.json'),JSON.stringify(out,null,2)+'\n');}
          NODE
          node "$RUNNER_TEMP/calendar-proof/probe.mjs" 2>&1 | tee "$PROBE_EVIDENCE_DIR/probe.log"
      - name: Check source stayed unchanged
        if: always()
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ecc66e610b9382eddb15275d019b81e0a4366fc6
          test "$(git rev-parse 'HEAD^{tree}')" = e6241ff9677c5208e1b2deb66e843477154d6b11
          test -z "$(git status --porcelain)"
      - name: Retain synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-ecc66e6-webkit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 5
          path: |
            ${{ runner.temp }}/calendar-evidence/CI-IDENTITY.json
            ${{ runner.temp }}/calendar-evidence/result.json
            ${{ runner.temp }}/calendar-evidence/BUILD-MANIFEST.json
            ${{ runner.temp }}/calendar-evidence/*.png
            ${{ runner.temp }}/calendar-evidence/probe.log
