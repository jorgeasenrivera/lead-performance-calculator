# Every push and every pull request.
#
# The reason this exists: three separate faults reached production in one week,
# all of them found by somebody noticing a wrong number on a screen days later.
# Every one of them was catchable in milliseconds. Checks that live on a laptop
# are checks that do not run.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The tests need no dependencies at all — they run against the shared
      # modules with Node's own test runner — but the build does, and a build
      # that fails is as broken as a test that fails.
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The feel, measured. The phone's bars (a tab under 150 ms, a tap drawn
  # under 100 ms, a press that gives with one tick, a return sign-in in about
  # a second) live in scripts/feel.mjs and used to pass only on a laptop. This
  # runs them on every push and pull request, in the browser image Playwright
  # publishes so the numbers come from the same machine every time, against
  # the local mock with a dealership's 400 ms on every data request. On a pull
  # request the table is posted as a comment, so every diff says what it did
  # to the phone.
  feel:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The browsers are in the image; only the package that drives them is needed,
      # and it is not a dependency of the app.
      - run: npm i --no-save playwright@1.63.0
      - name: Build against the mock
        run: |
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:5433\nVITE_SUPABASE_ANON_KEY=mock-anon-key\n' > .env.local
          npm run build
      - name: Measure
        id: feel
        run: |
          SALESPERSON=1 node scripts/mock-supabase.mjs > mock.log 2>&1 &
          npx vite preview --port 5178 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:5178/ > /dev/null && break; sleep 0.2; done
          set +e
          FEEL_URL=http://127.0.0.1:5178/ npm run feel 2>&1 | tee feel.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo 'table<<FEEL_END'
            grep -vE '^(> |$)' feel.txt
            echo 'FEEL_END'
          } >> "$GITHUB_OUTPUT"
          exit $code
      - name: Tell the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TABLE: ${{ steps.feel.outputs.table }}
          OUTCOME: ${{ steps.feel.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const mark = "<!-- sage-feel -->";
            const ok = process.env.OUTCOME === "success";
            const head = ok ? "The phone feels the same or better: every bar met." : "The phone feels worse: a bar was missed.";
            const body = `${mark}\n**${head}**\n\n\`\`\`\n${(process.env.TABLE || "(no table)").trim()}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.startsWith(mark));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
