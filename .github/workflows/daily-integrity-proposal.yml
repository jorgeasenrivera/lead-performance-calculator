name: daily-integrity-proposal
on:
  push:
    branches: [codex/daily-sales-integrity]
  pull_request:
    paths:
      - src/Manager.jsx
      - api/_digest-integrity.mjs
      - scripts/daily-sales-integrity-*.mjs
      - test/daily-sales-integrity.test.mjs
      - .github/workflows/daily-integrity-proposal.yml
permissions:
  contents: read
jobs:
  manager-proposal:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check out the immutable reviewed before source
        uses: actions/checkout@v4
        with:
          ref: 8d2befb7db44fb8ab8dcd855a5d09ccd62005906
          path: .daily-integrity-before
          sparse-checkout: src/Manager.jsx
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: node --test test/daily-sales-integrity.test.mjs
      - run: node scripts/daily-sales-integrity-proposal.mjs
        env:
          DAILY_BEFORE_SOURCE: .daily-integrity-before/src/Manager.jsx
      - name: Verify actual Manager components
        shell: bash
        env:
          FEEL_BROWSER: ${{ matrix.browser }}
        run: |
          npx vite preview --outDir dist-harness/daily-integrity --port 49215 --host 127.0.0.1 > after.log 2>&1 &
          npx vite preview --outDir dist-harness/daily-integrity-before --port 49216 --host 127.0.0.1 > before.log 2>&1 &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:49215/ > /dev/null && curl -sf http://127.0.0.1:49216/ > /dev/null && break; sleep 0.2; done
          node scripts/daily-sales-integrity-probe.mjs
      - name: Keep fictional proposal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-integrity-${{ matrix.browser }}
          path: |
            daily-integrity-evidence/
            before.log
            after.log
          if-no-files-found: error
