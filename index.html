<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Safari tints its own toolbars with this. Left unset it paints them white,
         which is the hard line the app's tinted background used to butt into at
         the top and bottom of the screen. Same value as --bg, and the same value
         the identity's page ground uses, so the reason has not changed. -->
    <meta name="theme-color" content="#F5F5F7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sage</title>
    <!-- The very first paint. Without this the browser shows its own white page
         until the app's stylesheet is parsed and React has something on screen,
         which on a phone opening cold is long enough to read as a flash. Same
         value as --bg and as the theme-color above, so the ground is already
         the app's ground before the app arrives. Inline on purpose: a linked
         stylesheet is another round trip, and the round trip is the gap being
         covered. -->
    <style>html, body { margin: 0; background: #F5F5F7; }</style>
    <!-- Which ground, though, depends on the screen this person lands on, and
         that is not knowable before the app has run: the manager's app is light
         and the salesperson's phone shell is dark unless their system says
         otherwise. A media query alone would swap the flash for the other half
         of the building. So the app records the ground it last drew for this
         person, and that is what gets painted first next time. Unknown falls
         back to light, which is the app's own --bg and what a first visit to
         the sign-in screen actually shows. -->
    <script>
      try {
        var g = localStorage.getItem("lpcf:ground");
        if (g === "dark") document.documentElement.style.background = "#0E1512";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The white flash across the sign-in arrival, and it lives HERE rather than
         in the app for one reason: the moment it exists to cover is the moment the
         signed-out tree is replaced by the signed-in one, and those two have
         different root components, so React tears the whole subtree down between
         them. Anything mounted inside either one is destroyed by the very swap it
         was drawn to hide — measured: the flash restarted at 0 on the frame the
         dashboard appeared. Outside React it cannot be unmounted, and it needs
         nothing from React: the beats drive it entirely through classes on <html>. -->
    <div class="sage-flash" aria-hidden="true"></div>
    <!-- The far end of the jump: the point the streaks converged on, left glowing
         for a moment after they have gone. The dashboard comes out of it. Static
         for the same reason the flash is — it has to outlive the swap between the
         signed-out and signed-in trees, and it is placed from --jx/--jy, which the
         sign-in screen measures off its own mark. -->
    <div class="sage-spark" aria-hidden="true"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
