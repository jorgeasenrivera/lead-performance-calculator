<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Safari tints its own toolbars with this. Left unset it paints them white,
         which is the hard line the app's tinted background used to butt into at
         the top and bottom of the screen. Same value as --bg, and the same value
         the identity's page ground uses, so the reason has not changed. -->
    <meta name="theme-color" content="#F5F5F7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sage</title>
    <!-- The app's own type, on the phone with the rest of it (public/fonts).
         Inline so nothing waits on a second stylesheet; the worker keeps the
         files, so a lot with no signal still draws Sage in Sage's faces. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geist-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geist-mono-latin.woff2" />
    <style>
      @font-face { font-family: 'Geist'; font-style: normal; font-weight: 300 700; font-display: swap; src: url(/fonts/geist-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Geist'; font-style: normal; font-weight: 300 700; font-display: swap; src: url(/fonts/geist-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/geist-mono-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/geist-mono-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/space-grotesk-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/space-grotesk-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    </style>
    <!-- The very first paint. Without this the browser shows its own white page
         until the app's stylesheet is parsed and React has something on screen,
         which on a phone opening cold is long enough to read as a flash. Same
         value as --bg and as the theme-color above, so the ground is already
         the app's ground before the app arrives. Inline on purpose: a linked
         stylesheet is another round trip, and the round trip is the gap being
         covered. -->
    <style>html, body { margin: 0; background: #F5F5F7; }</style>
    <!-- Which ground, though, depends on the screen this person lands on, and
         that is not knowable before the app has run: the manager's app is light
         and the salesperson's phone shell is dark unless their system says
         otherwise. A media query alone would swap the flash for the other half
         of the building. So the app records the ground it last drew for this
         person, and that is what gets painted first next time. Unknown falls
         back to light, which is the app's own --bg and what a first visit to
         the sign-in screen actually shows. -->
    <script>
      try {
        var g = localStorage.getItem("lpcf:ground");
        if (g === "dark") document.documentElement.style.background = "#0E1512";
        /* A phone that lives in the rooms opens under the curtain, and the
           curtain is what gets painted first: its green, edge to edge, and the
           status bar to match. The app then draws the same curtain over it,
           mark and all, and holds it until the room is there. */
        if (localStorage.getItem("lpcf:boot") === "rooms") {
          var h = document.documentElement;
          h.style.background = "linear-gradient(150deg,#7FA98A 0%,#55795F 55%,#26382C 100%) fixed";
          h.style.minHeight = "100%";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#5E8468");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The white flash across the sign-in arrival, and it lives HERE rather than
         in the app for one reason: the moment it exists to cover is the moment the
         signed-out tree is replaced by the signed-in one, and those two have
         different root components, so React tears the whole subtree down between
         them. Anything mounted inside either one is destroyed by the very swap it
         was drawn to hide — measured: the flash restarted at 0 on the frame the
         dashboard appeared. Outside React it cannot be unmounted, and it needs
         nothing from React: the beats drive it entirely through classes on <html>. -->
    <div class="sage-flash" aria-hidden="true"></div>
    <!-- The far end of the jump: the point the streaks converged on, left glowing
         for a moment after they have gone. The dashboard comes out of it. Static
         for the same reason the flash is — it has to outlive the swap between the
         signed-out and signed-in trees, and it is placed from --jx/--jy, which the
         sign-in screen measures off its own mark. -->
    <div class="sage-spark" aria-hidden="true"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
