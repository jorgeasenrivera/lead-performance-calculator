# Sage's SFTP server (C96). Loaded before the image's own drop-ins, and in
# sshd the first value wins, so nothing later can turn passwords back on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Keys live where the accounts cannot write, one file per account, kept in
# step with the repository by sage-keysync.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u

Match Group sftponly
    # Each account sees one folder, its own, and nothing else on the machine.
    ChrootDirectory /srv/sftp/%u
    ForceCommand internal-sftp -u 0027
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
