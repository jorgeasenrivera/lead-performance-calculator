/* The shape every shipping Expo module uses, and the reason it matters: the
   module plugin sets up a Maven publication for the library, and that reads
   android.defaultConfig.versionName. A project-level `version` is not the same
   field, so leaving the block out fails configuration with

     A problem occurred configuring project ':sage-live'
     > 'android.defaultConfig.versionName' is not defined

   which is what the first Android build died on. Compare expo-haptics: same
   plugins block, same group, same version in both places. */
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sageonline.sagelive'
version = '0.1.0'

android {
  namespace 'com.sageonline.sagelive'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  /* Live Updates reached the support library in 1.17.0, not 1.16.0: the release
     note for 1.17.0-alpha01 is the one that says "Added NotificationCompat.
     ProgressStyle and NotificationCompat.Builder.setRequestPromotedOngoing()".
     Pinned there and not at the newest, because 1.17 is the release that goes
     with compileSdk 36, which is what this project builds against, and taking
     the lowest version that has what you use is how that stays true.

     expo-modules-core brings core-ktx 1.13.1, which has none of it; Gradle
     resolves the two to the higher, so this line is what puts the API on the
     compile path. */
  implementation 'androidx.core:core-ktx:1.17.0'
}
